<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Nouvelle Livraison')}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<div class="container mt-4">
    <div class="row mb-4">
        <div class="col">
            <h1><i class="fas fa-truck me-2"></i>Nouvelle Livraison</h1>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/livraisons/save}" method="post" th:object="${livraisonRequest}" id="livraisonForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-4">
                    <h5><i class="fas fa-user me-2"></i>Information Client</h5>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="pointDeVenteId" class="form-label">Point de Vente</label>
                                <select class="form-control" id="pointDeVenteId" th:field="*{pointDeVenteId}">
                                    <option value="">-- Aucun (client hors réseau) --</option>
                                    <option th:each="pdv : ${pointsDeVente}"
                                            th:value="${pdv.id}"
                                            th:text="${pdv.nom}"
                                            th:data-nom="${pdv.nom}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="nomClient" class="form-label">Nom du Client</label>
                                <input type="text" class="form-control" id="nomClient" th:field="*{nomClient}"
                                       required placeholder="Entrez le nom du client"/>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <h5><i class="fas fa-industry me-2"></i>Production</h5>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="productionId" class="form-label">Sélectionner la Production</label>
                                <select class="form-control" id="productionId" th:field="*{productionId}" required>
                                    <option value="">Choisir une production...</option>
                                    <option th:each="production : ${productions}"
                                            th:value="${production.id}"
                                            th:text="${'Production du ' + #temporals.format(production.dateProduction, 'dd/MM/yyyy')}">
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <h5><i class="fas fa-box me-2"></i>Produits</h5>
                    <div id="produitsSection"></div>
                </div>

                <div class="text-end">
                    <a href="/livraisons" class="btn btn-secondary me-2">Annuler</a>
                    <button type="submit" class="btn btn-success" id="submitBtn">Enregistrer la Livraison</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    function loadProduits(productionId) {
        if (!productionId) return;
        const produitsSection = document.getElementById('produitsSection');
        if (!produitsSection) return;
        produitsSection.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
        fetch('/livraisons/ajax/production/' + productionId + '/produits')
            .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(data => {
                produitsSection.innerHTML = '';
                if (!data.produitsRestants || Object.keys(data.produitsRestants).length === 0) {
                    produitsSection.innerHTML = '<p class="text-muted">Aucun produit disponible.</p>';
                    return;
                }
                const card = document.createElement('div');
                card.className = 'card';
                const cardBody = document.createElement('div');
                cardBody.className = 'card-body';
                Object.entries(data.produitsRestants).forEach(([produitId, quantite]) => {
                    const nomProduit = data.nomsProduits[produitId] || { nom: 'Produit ' + produitId, prix: 0, quantiteAttendue: quantite };
                    const productRow = document.createElement('div');
                    productRow.className = 'row mb-3 align-items-center';
                    productRow.innerHTML = `
                    <div class="col-md-3"><label class="form-label">${nomProduit.nom || nomProduit}</label></div>
                    <div class="col-md-4"><div class="input-group">
                        <input type="number" class="form-control" name="produits[${produitId}].quantite" min="1" max="${quantite}" required/>
                        <span class="input-group-text">/ ${quantite}</span></div></div>
                    <div class="col-md-4"><div class="input-group">
                        <input type="number" class="form-control" name="produits[${produitId}].prixVente" step="0.01" min="0" required/>
                        <span class="input-group-text">Fcfa</span></div></div>`;
                    cardBody.appendChild(productRow);
                });
                card.appendChild(cardBody);
                produitsSection.appendChild(card);
            })
            .catch(err => {
                console.error(err);
                produitsSection.innerHTML = '<p class="text-danger">Erreur de chargement des produits.</p>';
            });
    }
    document.addEventListener('DOMContentLoaded', function () {
        const pdvSelect = document.getElementById('pointDeVenteId');
        const nomClientInput = document.getElementById('nomClient');
        if (pdvSelect && nomClientInput) {
            pdvSelect.addEventListener('change', function () {
                const nom = this.options[this.selectedIndex].getAttribute('data-nom');
                if (nom && !nomClientInput.value) nomClientInput.value = nom;
            });
        }
        const productionSelect = document.getElementById('productionId');
        if (productionSelect) {
            productionSelect.addEventListener('change', function () { loadProduits(this.value); });
            if (productionSelect.value) loadProduits(productionSelect.value);
        }
    });
</script>
</body>
</html>
