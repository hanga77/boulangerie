<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Livraisons par production')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>
<div th:replace="~{fragments/layout :: legacy-banner(
    'Livraisons liées à une production V1. Pour ProductionV2, utiliser le Cycle du jour.',
    '/cycle',
    'Cycle du jour')}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">
    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0">
                <i class="fas fa-truck me-2 text-info"></i>Livraisons — production du
                <span th:text="${production.dateProduction}"></span>
            </h1>
        </div>
        <a href="/production/previous" class="btn btn-outline-secondary btn-sm">Historique productions</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Date</th>
                    <th>Client</th>
                    <th class="text-end">Montant</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="livraison : ${livraisons}">
                    <td th:text="${livraison.id}"></td>
                    <td class="text-nowrap" th:text="${livraison.dateLivraison}"></td>
                    <td th:text="${livraison.nomClient}"></td>
                    <td class="text-end fw-semibold" th:text="${livraison.montantTotal + ' XAF'}"></td>
                    <td class="text-end">
                        <a th:href="@{/livraisons/{id}(id=${livraison.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="fas fa-eye"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(livraisons)}">
                    <td colspan="5" class="empty-state">Aucune livraison pour cette production</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
