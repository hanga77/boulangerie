<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Livraisons')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">

    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-truck me-2 text-info"></i>Livraisons</h1>
            <p class="text-muted small mb-0">Suivi des livraisons clients</p>
        </div>
        <a href="/livraisons/create" class="btn btn-primary btn-sm">
            <i class="fas fa-plus me-1"></i>Nouvelle livraison
        </a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>Client</th>
                    <th class="text-end">Montant</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="livraison, iterStat : ${livraisons}"
                    th:if="${iterStat.index >= (currentPage * size) and iterStat.index < ((currentPage + 1) * size)}">
                    <td class="text-nowrap" th:text="${livraison.dateLivraison}"></td>
                    <td th:text="${livraison.nomClient}"></td>
                    <td class="text-end fw-bold"
                        th:text="${livraison.montantTotal + ' XAF'}"></td>
                    <td class="text-end">
                        <div class="d-flex justify-content-end gap-1 flex-wrap">
                            <a th:href="@{/livraisons/{id}(id=${livraison.id})}"
                               class="btn btn-info btn-sm">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a th:href="@{/livraisons/{id}/imprimer(id=${livraison.id})}"
                               class="btn btn-outline-secondary btn-sm">
                                <i class="fas fa-print"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(livraisons)}">
                    <td colspan="4" class="text-center text-muted py-4">
                        <i class="fas fa-truck fa-2x d-block mb-2 opacity-25"></i>
                        Aucune livraison enregistrée
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer bg-transparent" th:if="${totalPages > 1}">
            <nav aria-label="Pagination livraisons">
                <ul class="pagination pagination-sm justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/livraisons(page=${currentPage - 1}, size=${size})}">&laquo;</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/livraisons(page=${i}, size=${size})}"
                           th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/livraisons(page=${currentPage + 1}, size=${size})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
