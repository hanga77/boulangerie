<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Livraisons du jour')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>
<div th:replace="~{fragments/layout :: legacy-banner(
    'Livraisons du jour (module historique V1). Préférer le Cycle pour les livraisons liées à ProductionV2.',
    '/cycle',
    'Cycle du jour')}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">
    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-truck me-2 text-info"></i>Livraisons du jour</h1>
            <p class="text-muted small mb-0">Historique V1</p>
        </div>
        <a href="/livraisons" class="btn btn-outline-secondary btn-sm">Toutes les livraisons</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Date</th>
                    <th>Commande</th>
                    <th class="d-none d-md-table-cell">Produits</th>
                    <th>Utilisateur</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="livraison : ${livraisons}">
                    <td th:text="${livraison.id}"></td>
                    <td class="text-nowrap" th:text="${livraison.dateLivraison}"></td>
                    <td th:text="${livraison.commande != null ? livraison.commande.id : '—'}"></td>
                    <td class="d-none d-md-table-cell small">
                        <span th:each="produit, i : ${livraison.produitsLivres}"
                              th:text="${produit.key.nom + ': ' + produit.value + (i.last ? '' : ', ')}"></span>
                    </td>
                    <td class="text-muted small"
                        th:text="${livraison.user != null ? livraison.user.username : '—'}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(livraisons)}">
                    <td colspan="5" class="empty-state">Aucune livraison aujourd'hui</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
