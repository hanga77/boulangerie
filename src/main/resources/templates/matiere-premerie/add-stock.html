<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrée stock')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container py-4 flex-grow-1" style="max-width:640px">
    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-plus-circle me-2 text-warning"></i>Entrée de stock</h1>
            <p class="text-muted small mb-0" th:text="${matierePremiere.nom}"></p>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body py-3 d-flex justify-content-between">
            <span class="text-muted">Stock actuel</span>
            <strong th:text="${matierePremiere.stock + ' ' + matierePremiere.uniteMesure}"></strong>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/matieres-premieres/add-stock}" method="post">
                <input type="hidden" name="id" th:value="${matierePremiere.id}">
                <div class="mb-3">
                    <label for="quantiteCommandee" class="form-label">Quantité commandée</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" id="quantiteCommandee"
                           name="quantiteCommandee" oninput="recalcNet()" required>
                </div>
                <div class="mb-3">
                    <label for="quantiteAvariee" class="form-label">Quantité avariée <span class="text-muted">(facultatif)</span></label>
                    <input type="number" step="0.01" min="0" value="0" class="form-control" id="quantiteAvariee"
                           name="quantiteAvariee" oninput="recalcNet()">
                </div>
                <div class="mb-3">
                    <label for="quantite" class="form-label">Quantité reçue nette <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" min="0.01" class="form-control bg-light" id="quantite"
                           name="quantite" readonly required>
                </div>
                <div class="mb-4">
                    <label for="prixUnitaire" class="form-label">Prix unitaire (XAF)</label>
                    <input type="number" step="1" min="1" class="form-control" id="prixUnitaire" name="prixUnitaire" required>
                    <div class="form-text">Utilisé pour la marge de production.</div>
                </div>
                <div class="d-flex justify-content-between gap-2">
                    <a th:href="@{/matieres-premieres}" class="btn btn-outline-secondary">Retour</a>
                    <button type="submit" class="btn btn-success"><i class="fas fa-plus me-1"></i>Ajouter au stock</button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    function recalcNet() {
        const cmd = parseFloat(document.getElementById("quantiteCommandee").value) || 0;
        const ava = parseFloat(document.getElementById("quantiteAvariee").value) || 0;
        const net = Math.max(0, cmd - ava);
        document.getElementById("quantite").value = net > 0 ? net.toFixed(2) : "";
    }
</script>
</body>
</html>
