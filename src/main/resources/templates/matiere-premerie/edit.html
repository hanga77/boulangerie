<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Modifier matière première')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>
<main class="container py-4 flex-grow-1" style="max-width:640px">
    <h1 class="h4 fw-bold mb-3">Modifier matière première</h1>
    <div class="card">
        <div class="card-body">
            <form th:action="@{/matieres-premieres/update/{id}(id=${matierePremiere.id})}" th:object="${matierePremiere}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label" for="nom">Nom</label>
                    <input type="text" class="form-control" id="nom" th:field="*{nom}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="uniteMesure">Unité de mesure</label>
                    <input type="text" class="form-control" id="uniteMesure" th:field="*{uniteMesure}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="stockMinimum">Stock minimum (alerte)</label>
                    <input type="number" step="any" class="form-control" id="stockMinimum" th:field="*{stockMinimum}" required>
                </div>
                <div class="d-flex gap-2">
                    <a href="/matieres-premieres" class="btn btn-outline-secondary">Annuler</a>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
