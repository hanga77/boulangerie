<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Matières Premières')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">

    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-leaf me-2 text-success"></i>Matières Premières</h1>
            <p class="text-muted small mb-0">Stocks et gestion des matières</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a href="/matieres-premieres/mouvements-stock" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-warehouse me-1"></i>Mouvements
            </a>
            <a href="/matieres-premieres/add-stock" class="btn btn-warning btn-sm">
                <i class="fas fa-plus-circle me-1"></i>Entrée stock
            </a>
            <a href="/matieres-premieres/new" class="btn btn-primary btn-sm">
                <i class="fas fa-plus me-1"></i>Ajouter
            </a>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Matière</th>
                    <th class="text-end">Stock</th>
                    <th>Unité</th>
                    <th class="text-end d-none d-md-table-cell">Stock min.</th>
                    <th class="text-center">État</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="matiere : ${matieresPremieres}">
                    <td class="fw-semibold" th:text="${matiere.nom}"></td>
                    <td class="text-end fw-bold" th:text="${matiere.stock}"></td>
                    <td class="text-muted small" th:text="${matiere.uniteMesure}"></td>
                    <td class="text-end d-none d-md-table-cell text-muted small"
                        th:text="${matiere.stockMinimum}"></td>
                    <td class="text-center">
                        <span th:if="${matiere.stockCritique}" class="badge bg-danger">Critique</span>
                        <span th:unless="${matiere.stockCritique}" class="badge bg-success">OK</span>
                    </td>
                    <td class="text-end">
                        <div class="btn-group-actions d-flex justify-content-end gap-1 flex-wrap">
                            <a th:href="@{/matieres-premieres/edit/{id}(id=${matiere.id})}"
                               class="btn btn-warning btn-sm">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{/matieres-premieres/delete/{id}(id=${matiere.id})}" method="post"
                                  onsubmit="return confirm('Supprimer cette matière première ?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(matieresPremieres)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        <i class="fas fa-inbox fa-2x d-block mb-2 opacity-25"></i>
                        Aucune matière première enregistrée
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer bg-transparent" th:if="${totalPages > 1}">
            <nav aria-label="Pagination matières">
                <ul class="pagination pagination-sm justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/matieres-premieres(page=${currentPage - 1}, size=${size})}">&laquo;</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/matieres-premieres(page=${i}, size=${size})}"
                           th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/matieres-premieres(page=${currentPage + 1}, size=${size})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
