<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Gestion des Mouvements de Stock')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1"><i class="fas fa-warehouse me-2 text-primary"></i>Mouvements de Stock</h1>
            <p class="text-muted mb-0">Entrées, sorties et retours de matières premières</p>
        </div>
        <div class="d-flex gap-2">
            <a href="/matieres-premieres/print" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-print me-1"></i>Imprimer le jour
            </a>
            <a href="/matieres-premieres" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left me-1"></i>Retour aux matières premières
            </a>
        </div>
    </div>

    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
            <i class="fas fa-exchange-alt me-2"></i>Enregistrer un mouvement
        </div>
        <div class="card-body">
            <form th:action="@{/matieres-premieres/mouvements-stock}" method="post" id="mouvementForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="matierePremiereId" class="form-label">Matière première <span class="text-danger">*</span></label>
                        <select class="form-select" id="matierePremiereId" name="matierePremiereId" required>
                            <option value="" disabled selected>-- Choisir --</option>
                            <option th:each="m : ${matieresPremieres}"
                                    th:value="${m.id}"
                                    th:text="${m.nom} + ' (' + ${m.stock} + ' ' + ${m.uniteMesure} + ')'"></option>
                        </select>
                    </div>
                    <div class="col-md-2" id="quantiteCommandeeField" style="display:none;">
                        <label for="quantiteCommandee" class="form-label">Qté commandée <span class="text-danger">*</span></label>
                        <input type="number" step="0.001" min="0.001" class="form-control"
                               id="quantiteCommandee" name="quantiteCommandee"
                               oninput="recalcNetEntree()">
                    </div>
                    <div class="col-md-2" id="quantiteAvarieeField" style="display:none;">
                        <label for="quantiteAvariee" class="form-label">Qté avariée</label>
                        <input type="number" step="0.001" min="0" value="0" class="form-control"
                               id="quantiteAvariee" name="quantiteAvariee"
                               oninput="recalcNetEntree()">
                    </div>
                    <div class="col-md-2">
                        <label for="quantite" class="form-label">
                            <span id="quantiteLabelNette" style="display:none;">Qté reçue nette</span>
                            <span id="quantiteLabelNormal">Quantité</span>
                            <span class="text-danger">*</span>
                        </label>
                        <input type="number" step="0.001" min="0.001" class="form-control"
                               id="quantite" name="quantite" required>
                    </div>
                    <div class="col-md-3">
                        <label for="type" class="form-label">Type <span class="text-danger">*</span></label>
                        <select class="form-select" id="type" name="type" required onchange="toggleFields()">
                            <option value="ENTREE">Entrée (réception fournisseur)</option>
                            <option value="SORTIE">Sortie (liée à une production)</option>
                            <option value="RETOUR">Retour au magasin</option>
                            <option value="PERTE">Perte / Casse</option>
                        </select>
                    </div>
                    <div class="col-md-3" id="prixUnitaireField" style="display:none;">
                        <label for="prixUnitaire" class="form-label">Prix unitaire (XAF) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" min="0.01" class="form-control"
                               id="prixUnitaire" name="prixUnitaire">
                    </div>
                    <div class="col-md-5" id="productionField" style="display:none;">
                        <label for="productionId" class="form-label">
                            Production de référence <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="productionId" name="productionId">
                            <option value="" disabled selected>-- Choisir une production --</option>
                            <option th:each="p : ${productions}"
                                    th:value="${p.id}"
                                    th:text="'Production du ' + ${#temporals.format(p.dateProduction, 'dd/MM/yyyy')} + ' (ID ' + ${p.id} + ')'"></option>
                        </select>
                    </div>
                    <div class="col-12" id="theoriqueBox" style="display:none;">
                        <div class="alert alert-info mb-0 py-2 small">
                            <strong>Théorique calculé :</strong>
                            <span id="theoriqueContent"></span>
                        </div>
                    </div>
                    <div class="col-md-5" id="motifField" style="display:none;">
                        <label for="motif" class="form-label">Motif</label>
                        <input type="text" class="form-control" id="motif" name="motif"
                               placeholder="Ex: Casse, Péremption…">
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save me-1"></i>Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white">Historique des mouvements</div>
        <div class="table-responsive">
            <table class="table table-striped table-sm mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Date</th><th>Matière</th><th>Type</th><th class="text-end">Qté</th>
                    <th>Production</th><th>Motif</th><th>Utilisateur</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(mouvementsStock)}">
                    <td colspan="7" class="text-center text-muted py-4">Aucun mouvement</td>
                </tr>
                <tr th:each="m : ${mouvementsStock}">
                    <td th:text="${#temporals.format(m.date, 'dd/MM/yyyy')}"></td>
                    <td th:text="${m.matierePremiere.nom}"></td>
                    <td th:text="${m.type}"></td>
                    <td class="text-end" th:text="${m.quantite}"></td>
                    <td th:text="${m.production != null ? m.production.id : '—'}"></td>
                    <td th:text="${m.motif != null ? m.motif : '—'}"></td>
                    <td th:text="${m.user != null ? m.user.username : '—'}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:inline="javascript">
    const theoriqueParProduction = /*[[${theoriqueParProduction}]]*/ {};
    function updateTheoriqueBox() {
        const box = document.getElementById("theoriqueBox");
        const content = document.getElementById("theoriqueContent");
        const prodId = document.getElementById("productionId").value;
        const theorique = theoriqueParProduction[prodId];
        if (!theorique || Object.keys(theorique).length === 0) { box.style.display = "none"; return; }
        content.textContent = Object.entries(theorique).map(([n,q]) => n + " : " + q).join(" — ");
        box.style.display = "block";
    }
    function toggleFields() {
        const type = document.getElementById("type").value;
        const showEntree = type === "ENTREE";
        document.getElementById("prixUnitaireField").style.display = showEntree ? "block" : "none";
        document.getElementById("quantiteCommandeeField").style.display = showEntree ? "block" : "none";
        document.getElementById("quantiteAvarieeField").style.display = showEntree ? "block" : "none";
        document.getElementById("productionField").style.display = type === "SORTIE" ? "block" : "none";
        document.getElementById("motifField").style.display = (type === "RETOUR" || type === "PERTE") ? "block" : "none";
        const prix = document.getElementById("prixUnitaire");
        const cmd = document.getElementById("quantiteCommandee");
        const prod = document.getElementById("productionId");
        const motif = document.getElementById("motif");
        if (showEntree) { prix.setAttribute("required","required"); cmd.setAttribute("required","required"); }
        else { prix.removeAttribute("required"); cmd.removeAttribute("required"); }
        if (type === "SORTIE") prod.setAttribute("required","required"); else prod.removeAttribute("required");
        if (type === "PERTE") motif.setAttribute("required","required"); else motif.removeAttribute("required");
    }
    function recalcNetEntree() {
        const cmd = parseFloat(document.getElementById("quantiteCommandee").value) || 0;
        const ava = parseFloat(document.getElementById("quantiteAvariee").value) || 0;
        document.getElementById("quantite").value = Math.max(0, cmd - ava) > 0 ? (cmd - ava).toFixed(3) : "";
    }
    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("productionId").addEventListener("change", updateTheoriqueBox);
        toggleFields();
    });
</script>
</body>
</html>
