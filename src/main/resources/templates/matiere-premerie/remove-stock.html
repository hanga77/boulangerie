<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sortie stock')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>
<main class="container py-4 flex-grow-1" style="max-width:640px">
    <h1 class="h4 fw-bold mb-3">Sortie / ajustement stock</h1>
    <p class="text-muted" th:text="${matierePremiere.nom}"></p>
    <div class="card">
        <div class="card-body">
            <form th:action="@{/matieres-premieres/remove-stock}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="id" th:value="${matierePremiere.id}">
                <div class="mb-3">
                    <label for="quantite" class="form-label">Quantité</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" id="quantite" name="quantite" required>
                </div>
                <div class="d-flex gap-2">
                    <a href="/matieres-premieres" class="btn btn-outline-secondary">Retour</a>
                    <button type="submit" class="btn btn-warning">Valider</button>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
