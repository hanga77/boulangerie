<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sortie stock')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container py-4 flex-grow-1" style="max-width:640px">
    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-minus-circle me-2 text-danger"></i>Retrait de stock</h1>
            <p class="text-muted small mb-0" th:text="${matierePremiere.nom}"></p>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body py-3 d-flex justify-content-between">
            <span class="text-muted">Stock actuel</span>
            <strong th:text="${matierePremiere.stock + ' ' + matierePremiere.uniteMesure}"></strong>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/matieres-premieres/remove-stock}" method="post">
                <input type="hidden" name="id" th:value="${matierePremiere.id}">
                <div class="mb-4">
                    <label for="quantite" class="form-label">Quantité à retirer</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" id="quantite" name="quantite" required>
                </div>
                <div class="d-flex justify-content-between gap-2">
                    <a th:href="@{/matieres-premieres}" class="btn btn-outline-secondary">Retour</a>
                    <button type="submit" class="btn btn-warning"
                            onclick="return confirm('Confirmer le retrait de stock ?');">
                        <i class="fas fa-minus me-1"></i>Retirer
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
