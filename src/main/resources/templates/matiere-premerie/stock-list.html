<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Gestion des Mouvements de Stock')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">
    <div class="page-header">
        <h1><i class="fas fa-warehouse me-2 text-primary"></i>Mouvements de stock</h1>
        <div class="d-flex gap-2 flex-wrap">
            <a th:href="@{/matieres-premieres/mouvements-stock}" class="btn btn-primary btn-sm">
                <i class="fas fa-plus me-1"></i>Ajouter / retirer
            </a>
            <a th:href="@{/mouvements/stock-summary(date=${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')})}" class="btn btn-outline-info btn-sm">
                <i class="fas fa-chart-bar me-1"></i>Résumé
            </a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/mouvements}" method="get" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="dateDebut" class="form-label">Date début</label>
                    <input type="date" id="dateDebut" name="dateDebut" class="form-control"
                           th:value="${dateDebut}">
                </div>
                <div class="col-md-4">
                    <label for="dateFin" class="form-label">Date fin</label>
                    <input type="date" id="dateFin" name="dateFin" class="form-control"
                           th:value="${dateFin}">
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-search me-1"></i>Filtrer
                    </button>
                    <a th:href="@{/mouvements/print(date=${dateDebut})}" target="_blank" class="btn btn-outline-secondary">
                        <i class="fas fa-print me-1"></i>Imprimer
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" aria-label="Liste des mouvements de stock">
                <thead>
                <tr>
                    <th>Date/Heure</th>
                    <th>Type</th>
                    <th>Matière Première</th>
                    <th>Quantité</th>
                    <th>Motif</th>
                    <th>Utilisateur</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${mouvements == null or mouvements.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-4">
                        Aucun mouvement trouvé pour la période sélectionnée.
                    </td>
                </tr>
                <tr th:each="mouvement : ${mouvements}">
                    <td th:text="${#temporals.format(mouvement.date, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <span th:if="${mouvement.type == 'ENTREE'}" class="badge bg-success">Entrée</span>
                        <span th:if="${mouvement.type == 'SORTIE'}" class="badge bg-danger">Sortie</span>
                        <span th:if="${mouvement.type == 'RETOUR'}" class="badge bg-warning text-dark">Retour</span>
                        <span th:if="${mouvement.type == 'PERTE'}" class="badge bg-secondary">Perte</span>
                    </td>
                    <td th:text="${mouvement.matierePremiere.nom}"></td>
                    <td th:text="${mouvement.quantite + ' ' + mouvement.matierePremiere.uniteMesure}"></td>
                    <td th:text="${mouvement.motif}"></td>
                    <td th:text="${mouvement.user}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
