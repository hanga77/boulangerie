<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nouvelle commande')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1" style="max-width:760px">

    <div class="d-flex align-items-center gap-2 mb-4">
        <div class="rounded-circle bg-primary bg-opacity-10 p-3">
            <i class="fas fa-clipboard-list fa-lg text-primary"></i>
        </div>
        <div>
            <h1 class="h4 fw-bold mb-0">Nouvelle commande</h1>
            <p class="text-muted small mb-0" th:text="${pointDeVente.nom}"></p>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/mon-espace/commande}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <table class="table table-sm align-middle">
                    <thead class="table-light"><tr><th>Produit</th><th>Prix</th><th style="width:140px">Quantité</th></tr></thead>
                    <tbody>
                    <tr th:each="p : ${produits}">
                        <td th:text="${p.nom}"></td>
                        <td th:text="${#numbers.formatDecimal(p.prix,0,'COMMA',0,'POINT') + ' XAF'}"></td>
                        <td>
                            <input type="number" min="0" step="1" class="form-control form-control-sm"
                                   th:name="'produitsCommandes[' + ${p.id} + ']'" placeholder="0"/>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="d-flex gap-2 mt-3">
                    <a href="/mon-espace" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-1"></i>Annuler
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane me-1"></i>Envoyer la commande
                    </button>
                </div>
            </form>
        </div>
    </div>

</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
