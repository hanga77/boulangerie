<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Valider production')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="flex-grow-1 container py-4" style="max-width:800px">

    <div class="d-flex align-items-center gap-2 mb-4">
        <div class="rounded-circle bg-warning bg-opacity-25 p-3">
            <i class="fas fa-check fa-lg text-warning"></i>
        </div>
        <div>
            <h1 class="h4 fw-bold mb-0">Valider les quantités produites</h1>
            <p class="text-muted small mb-0">Production #<span th:text="${productionId}">1</span></p>
        </div>
    </div>

    <form th:action="@{/cycle/valider/{id}(id=${productionId})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="card shadow-sm mb-3">
            <div class="card-header bg-white py-3">
                <h6 class="mb-0 fw-semibold">Produits (quantité réelle sortie du four)</h6>
            </div>
            <div class="card-body">
                <div class="row g-2" th:each="p : ${produits}">
                    <div class="col-7">
                        <label class="form-label small mb-0" th:text="${p.nom}">Pain</label>
                    </div>
                    <div class="col-5">
                        <input type="number" min="0" class="form-control form-control-sm"
                               th:name="|produit[${p.id}]|" placeholder="Qté réelle">
                    </div>
                </div>
                <p class="text-muted small mt-2 mb-0">
                    Saisissez uniquement les produits de cette production (laissez vide sinon).
                </p>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <h6 class="mb-0 fw-semibold">Matières déclarées boulanger <span class="text-muted fw-normal">(optionnel)</span></h6>
            </div>
            <div class="card-body">
                <div class="row g-2 mb-2" th:each="l : ${feuille.lignes()}">
                    <div class="col-7">
                        <span th:text="${l.nom()}">Farine</span>
                        <span class="text-muted small" th:text="' (théo. ' + ${#numbers.formatDecimal(l.quantiteTheorique(), 1, 'COMMA', 2, 'POINT')} + ')'"></span>
                    </div>
                    <div class="col-5">
                        <input type="number" step="0.001" min="0" class="form-control form-control-sm"
                               th:name="|matiere[${l.matierePremiereId()}]|" placeholder="Déclaré">
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <a href="/cycle" class="btn btn-outline-secondary">Annuler</a>
            <button type="submit" class="btn btn-warning">
                <i class="fas fa-check me-1"></i>Valider la production
            </button>
        </div>
    </form>

</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
