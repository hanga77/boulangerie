<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vente libre V2')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="flex-grow-1 container py-4" style="max-width:720px">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h4 fw-bold mb-0">Vente libre — Production V2 #<span th:text="${production.id}"></span></h1>
            <p class="text-muted small mb-0">Stock restant de la production</p>
        </div>
        <a href="/cycle" class="btn btn-sm btn-outline-secondary">Cycle du jour</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/cycle/vente/{id}(id=${production.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Moyen de paiement</label>
                    <select name="moyenPaiement" class="form-select">
                        <option value="ESPECES">Espèces</option>
                        <option value="MOBILE_MONEY">Mobile Money</option>
                    </select>
                </div>

                <table class="table table-sm">
                    <thead><tr><th>Produit</th><th class="text-end">Restant</th><th class="text-end">Prix</th><th class="text-end">Qté vendue</th></tr></thead>
                    <tbody>
                    <tr th:each="e : ${restants}">
                        <td th:text="${e.value[0]}"></td>
                        <td class="text-end" th:text="${e.value[1]}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(e.value[2],0,'COMMA',0,'POINT')}"></td>
                        <td class="text-end" style="width:110px">
                            <input type="number" min="0" th:max="${e.value[1]}" class="form-control form-control-sm text-end"
                                   th:name="|qte[${e.key}]|" value="0">
                        </td>
                    </tr>
                    <tr th:if="${restants.isEmpty()}">
                        <td colspan="4" class="text-muted text-center">Plus de stock sur cette production</td>
                    </tr>
                    </tbody>
                </table>

                <button type="submit" class="btn btn-success" th:disabled="${restants.isEmpty()}">
                    <i class="fas fa-cash-register me-1"></i>Enregistrer la vente
                </button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white fw-semibold">Ventes déjà enregistrées</div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between" th:each="v : ${ventes}">
                <span>#<span th:text="${v.id}"></span> — <span th:text="${v.moyenPaiement}"></span></span>
                <span class="fw-semibold" th:text="${#numbers.formatDecimal(v.montantTotal,0,'COMMA',0,'POINT') + ' XAF'}"></span>
            </li>
            <li class="list-group-item text-muted" th:if="${#lists.isEmpty(ventes)}">Aucune</li>
        </ul>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
