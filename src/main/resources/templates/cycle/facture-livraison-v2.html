<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; color: #222; }
        h1 { font-size: 18px; margin-bottom: 4px; }
        .muted { color: #666; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ccc; padding: 6px 8px; }
        th { background: #f5f5f5; text-align: left; }
        .text-end { text-align: right; }
        .total { font-size: 14px; font-weight: bold; margin-top: 12px; }
        .header { margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="header">
    <h1 th:text="${appName}">Gestiboul</h1>
    <div class="muted">Facture livraison</div>
    <p>
        N° facture : <strong th:text="${livraison.factureNumero != null ? livraison.factureNumero : ('LIV-V2-' + livraison.id)}">FAC</strong><br/>
        Livraison V2 #<span th:text="${livraison.id}">1</span><br/>
        Date : <span th:text="${#temporals.format(livraison.dateLivraison, 'dd/MM/yyyy')}"></span><br/>
        Client : <span th:text="${livraison.nomClient}"></span><br/>
        Production V2 #<span th:text="${livraison.productionV2Id}"></span>
    </p>
</div>

<table>
    <thead>
    <tr>
        <th>Produit</th>
        <th class="text-end">Qté</th>
        <th class="text-end">Prix unit.</th>
        <th class="text-end">Total</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="l : ${lignes}">
        <td th:text="${l.nom}"></td>
        <td class="text-end" th:text="${l.quantite}"></td>
        <td class="text-end" th:text="${#numbers.formatDecimal(l.prixVente, 0, 'COMMA', 0, 'POINT')}"></td>
        <td class="text-end" th:text="${#numbers.formatDecimal(l.total, 0, 'COMMA', 0, 'POINT')}"></td>
    </tr>
    </tbody>
</table>

<p class="total">
    Montant total :
    <span th:text="${#numbers.formatDecimal(livraison.montantTotal, 0, 'COMMA', 0, 'POINT') + ' XAF'}"></span>
</p>
<p class="muted" th:if="${livraison.revenuEnregistre}">Revenu enregistré en comptabilité.</p>
<p class="muted">
    Imprimé le <span th:text="${#temporals.format(dateImpression, 'dd/MM/yyyy HH:mm')}"></span>
    par <span th:text="${user != null ? user.username : ''}"></span>
</p>
</body>
</html>
