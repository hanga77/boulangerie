<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lancer production V2')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="flex-grow-1 container py-4" style="max-width:720px">
    <div class="mb-4">
        <h1 class="h4 fw-bold mb-0">
            <i class="fas fa-industry me-2 text-success"></i>Lancer la production (Cycle V2)
        </h1>
        <p class="text-muted small mb-0">À partir des commandes du jour · farinage optionnel</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/cycle/lancer}" method="post" id="formLancer">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label" for="date">Date de production</label>
                    <input type="date" id="date" name="date" class="form-control"
                           th:value="${dateActuelle}" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-md-7">
                        <label class="form-label">Farinage — matière (optionnel)</label>
                        <select name="farinageMatiereId" id="farinageMatiereId" class="form-select">
                            <option value="">— Aucun —</option>
                            <option th:each="m : ${matieres}" th:value="${m.id}" th:text="${m.nom}"></option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">Quantité farinage</label>
                        <input type="number" step="0.001" min="0" name="farinageQuantite"
                               id="farinageQuantite" class="form-control" placeholder="0">
                    </div>
                </div>
                <p class="small text-muted">Si une matière de farinage est choisie, la quantité doit être &gt; 0.</p>
                <div class="d-flex gap-2">
                    <a href="/cycle" class="btn btn-outline-secondary">Annuler</a>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-play me-1"></i>Démarrer
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
(function () {
  var f = document.getElementById('formLancer');
  if (!f) return;
  f.addEventListener('submit', function (e) {
    var mat = document.getElementById('farinageMatiereId');
    var qte = document.getElementById('farinageQuantite');
    if (mat && qte && mat.value && (!qte.value || parseFloat(qte.value) <= 0)) {
      e.preventDefault();
      alert('Indiquez une quantité de farinage > 0 si une matière est sélectionnée.');
      qte.focus();
    }
  });
})();
</script>
</body>
</html>
