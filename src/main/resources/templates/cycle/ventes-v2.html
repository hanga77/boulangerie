<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ventes V2')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="flex-grow-1 container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h1 class="h4 fw-bold mb-0">
                <i class="fas fa-cash-register me-2 text-success"></i>Historique ventes V2
            </h1>
            <p class="text-muted small mb-0">Caisse et ventes libres liées à ProductionV2</p>
        </div>
        <div class="d-flex gap-2">
            <a href="/cycle/caisse" class="btn btn-sm btn-success">Caisse</a>
            <a href="/cycle" class="btn btn-sm btn-outline-secondary">Cycle</a>
        </div>
    </div>

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <form method="get" action="/cycle/ventes-v2" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small">Du</label>
                    <input type="date" name="debut" class="form-control form-control-sm" th:value="${debut}">
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Au</label>
                    <input type="date" name="fin" class="form-control form-control-sm" th:value="${fin}">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary btn-sm w-100">
                        <i class="fas fa-filter me-1"></i>Filtrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-6 col-md-3">
            <div class="card shadow-sm"><div class="card-body py-3">
                <div class="text-muted small">Nombre</div>
                <div class="fs-4 fw-bold" th:text="${nb}">0</div>
            </div></div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card shadow-sm"><div class="card-body py-3">
                <div class="text-muted small">Montant total</div>
                <div class="fs-5 fw-bold"
                     th:text="${#numbers.formatDecimal(totalMontant, 0, 'COMMA', 0, 'POINT') + ' XAF'}">0</div>
            </div></div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card shadow-sm"><div class="card-body py-3">
                <div class="text-muted small">Espèces</div>
                <div class="fs-4 fw-bold" th:text="${nbEspeces}">0</div>
            </div></div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card shadow-sm"><div class="card-body py-3">
                <div class="text-muted small">Mobile Money</div>
                <div class="fs-4 fw-bold" th:text="${nbMobile}">0</div>
            </div></div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>N°</th>
                    <th>Prod. V2</th>
                    <th>Paiement</th>
                    <th class="text-end">Montant</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${ventes}">
                    <td class="text-nowrap" th:text="${#temporals.format(v.dateVente, 'dd/MM/yyyy')}"></td>
                    <td th:text="|'#' + ${v.id}|"></td>
                    <td>
                        <a th:href="@{/cycle/caisse/{id}(id=${v.productionV2Id})}"
                           th:text="|'#' + ${v.productionV2Id}|"></a>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${v.moyenPaiement == 'MOBILE_MONEY'} ? 'text-bg-info' : 'text-bg-secondary'"
                              th:text="${v.moyenPaiement}">ESPECES</span>
                    </td>
                    <td class="text-end fw-semibold"
                        th:text="${#numbers.formatDecimal(v.montantTotal, 0, 'COMMA', 0, 'POINT') + ' XAF'}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(ventes)}">
                    <td colspan="5" class="text-center text-muted py-4">Aucune vente V2 sur la période</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
