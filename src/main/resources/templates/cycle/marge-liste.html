<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Marge productions')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>
<main class="container py-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h1 class="h4 fw-bold mb-0"><i class="fas fa-chart-pie me-2 text-primary"></i>Marge par production</h1>
        <form method="get" class="d-flex gap-2">
            <input type="date" name="date" class="form-control form-control-sm" th:value="${date}">
            <button class="btn btn-sm btn-primary">OK</button>
        </form>
    </div>
    <p class="small text-muted">CA (livraisons + caisse V2) − coût matières (prix unitaire stock). Charges fixes non ventilées par lot.</p>
    <div class="alert alert-secondary small" th:if="${detteFournisseurs != null}">
        Dettes fournisseurs en cours :
        <strong th:text="${#numbers.formatDecimal(detteFournisseurs, 0, 'COMMA', 0, 'POINT') + ' XAF'}"></strong>
        (engagement, pas encore une dépense tant que non remboursé)
    </div>
    <div class="table-responsive card shadow-sm">
        <table class="table table-sm table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>Prod #</th>
                <th>Statut</th>
                <th class="text-end">Coût matières</th>
                <th class="text-end">CA</th>
                <th class="text-end">Marge</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${marges}">
                <td th:text="${m.productionId()}"></td>
                <td><span class="badge text-bg-light border" th:text="${m.statut()}"></span></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(m.coutMatieres(), 0, 'COMMA', 0, 'POINT')}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(m.caTotal(), 0, 'COMMA', 0, 'POINT')}"></td>
                <td class="text-end fw-bold"
                    th:classappend="${m.rentable()} ? 'text-success' : 'text-danger'"
                    th:text="${#numbers.formatDecimal(m.marge(), 0, 'COMMA', 0, 'POINT') + ' XAF'}"></td>
                <td><a th:href="@{/cycle/marge/{id}(id=${m.productionId()})}" class="btn btn-sm btn-outline-primary">Détail</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(marges)}">
                <td colspan="6" class="text-center text-muted py-4">Aucune production ce jour</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
