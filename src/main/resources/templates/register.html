<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inscription')}"></head>
<body class="d-flex align-items-center justify-content-center min-vh-100" style="background:var(--bs-body-bg)">

<div class="auth-card card p-4 p-md-5 mx-3">
    <div class="text-center mb-4">
        <i class="fas fa-user-plus fa-2x text-primary mb-2"></i>
        <h1 class="h4 fw-bold mb-0">Créer un compte</h1>
        <p class="text-muted small">Rejoignez l'équipe boulangerie</p>
    </div>

<form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Nom d'utilisateur</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="Choisissez un identifiant" required autofocus>
            </div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Choisissez un mot de passe" required>
            </div>
        </div>
        <div class="mb-4">
            <label for="role" class="form-label">Rôle</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-id-badge text-muted"></i></span>
                <select class="form-select" id="role" name="role">
                    <option value="MANAGER">Manager</option>
                    <option value="BOULANGER">Boulanger</option>
                    <option value="MAGASINIER">Magasinier</option>
                    <option value="CAISSIER">Caissier</option>
                    <option value="POINT_DE_VENTE">Point de vente / Livreur</option>
                </select>
            </div>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-user-plus me-2"></i>S'inscrire
            </button>
        </div>
    </form>

    <hr class="my-4">
    <p class="text-center text-muted small mb-0">
        Déjà un compte ? <a href="/login" class="text-primary">Se connecter</a>
    </p>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
