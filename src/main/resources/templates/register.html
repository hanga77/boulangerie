<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inscription')}"></head>
<body class="auth-page d-flex align-items-center justify-content-center">

<div th:replace="~{fragments/layout :: flash-messages}"></div>

<div class="auth-card card p-4 p-md-5 mx-3 border-0">
    <div class="text-center mb-4">
        <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3"
             style="width:64px;height:64px">
            <i class="fas fa-user-plus fa-lg text-primary"></i>
        </div>
        <h1 class="h4 fw-bold mb-0">Créer un compte</h1>
        <p class="text-muted small mb-0">Gestiboul — inscription</p>
    </div>

    <form th:action="@{/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="mb-3">
            <label for="username" class="form-label">Nom d'utilisateur</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="fas fa-user text-muted"></i></span>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="Identifiant" required autofocus autocomplete="username">
            </div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Mot de passe" required autocomplete="new-password" minlength="6">
            </div>
        </div>
        <div class="mb-4">
            <label for="role" class="form-label">Rôle demandé</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="fas fa-id-badge text-muted"></i></span>
                <select class="form-select" id="role" name="role">
                    <option value="BOULANGER">Boulanger</option>
                    <option value="MAGASINIER">Magasinier</option>
                    <option value="CAISSIER">Caissier</option>
                    <option value="POINT_DE_VENTE">Point de vente / Livreur</option>
                </select>
            </div>
            <div class="form-text">Un administrateur devra activer le compte.</div>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-user-plus me-2"></i>S'inscrire
            </button>
        </div>
    </form>

    <hr class="my-4">
    <p class="text-center text-muted small mb-0">
        Déjà un compte ? <a href="/login" class="text-primary fw-semibold">Se connecter</a>
    </p>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
