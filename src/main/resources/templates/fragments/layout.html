<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ===== HEAD FRAGMENT ===== -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — Boulangerie'">Boulangerie</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="d-flex flex-column min-vh-100">

<!-- ===== NAVBAR FRAGMENT ===== -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
    <div class="container-fluid px-3">

        <!-- Brand -->
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/dashboard">
            <img th:if="${customLogoUrl != null}" th:src="${customLogoUrl}"
                 alt="Logo" style="height:32px; width:auto; object-fit:contain;">
            <i th:unless="${customLogoUrl != null}" class="fas fa-bread-slice"></i>
            <span class="d-none d-sm-inline">Boulangerie</span>
        </a>

        <!-- Hamburger -->
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Nav links -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto gap-0 gap-lg-1 py-2 py-lg-0">
                <li class="nav-item">
                    <a class="nav-link rounded px-2" href="/dashboard">
                        <i class="fas fa-home me-1"></i>Accueil
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded px-2" href="/commandes">
                        <i class="fas fa-shopping-cart me-1"></i>Commandes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded px-2" href="/production">
                        <i class="fas fa-industry me-1"></i>Production
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded px-2" href="/livraisons">
                        <i class="fas fa-truck me-1"></i>Livraisons
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded px-2" href="/ventes-libres">
                        <i class="fas fa-store me-1"></i>Ventes
                    </a>
                </li>

                <!-- Gestion dropdown -->
                <li class="nav-item dropdown">
                    <a class="nav-link rounded px-2 dropdown-toggle" href="#"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-boxes me-1"></i>Gestion
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li>
                            <a class="dropdown-item" href="/matieres-premieres">
                                <i class="fas fa-leaf me-2"></i>Matières Premières
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="/produits">
                                <i class="fas fa-cookie-bite me-2"></i>Produits
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="/matieres-premieres/mouvements-stock">
                                <i class="fas fa-warehouse me-2"></i>Mouvements Stock
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="/points-de-vente">
                                <i class="fas fa-map-marker-alt me-2"></i>Points de Vente
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="/fournisseurs">
                                <i class="fas fa-truck-loading me-2"></i>Fournisseurs
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="/fournisseurs/dettes">
                                <i class="fas fa-hand-holding-usd me-2 text-danger"></i>Dettes fournisseurs
                            </a>
                        </li>
                    </ul>
                </li>

                <li class="nav-item">
                    <a class="nav-link rounded px-2" href="/finances">
                        <i class="fas fa-chart-line me-1"></i>Finances
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded px-2" href="/comptabilite/dashboard">
                        <i class="fas fa-calculator me-1"></i>Comptabilité
                    </a>
                </li>
                <!-- Admin dropdown -->
                <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link rounded px-2 dropdown-toggle" href="#"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-users-cog me-1"></i>Admin
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" href="/admin/users">
                                <i class="fas fa-users me-2"></i>Utilisateurs
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="/admin/settings">
                                <i class="fas fa-cog me-2"></i>Paramètres
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>

            <!-- User + logout -->
            <ul class="navbar-nav align-items-lg-center gap-1 pb-2 pb-lg-0">
                <li class="nav-item">
                    <span class="nav-link text-white-50 small">
                        <i class="fas fa-user-circle me-1"></i>
                        <span sec:authentication="principal.username"></span>
                    </span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-light rounded-pill px-3">
                            <i class="fas fa-sign-out-alt me-1"></i>Déconnexion
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===== FLASH MESSAGES FRAGMENT ===== -->
<div th:fragment="flash-messages" class="container-fluid px-3 px-md-4 mt-2">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible d-flex align-items-center" role="alert">
        <i class="fas fa-check-circle me-2 flex-shrink-0"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
    <div th:if="${success}" class="alert alert-success alert-dismissible d-flex align-items-center" role="alert">
        <i class="fas fa-check-circle me-2 flex-shrink-0"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible d-flex align-items-center" role="alert">
        <i class="fas fa-exclamation-circle me-2 flex-shrink-0"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible d-flex align-items-center" role="alert">
        <i class="fas fa-exclamation-circle me-2 flex-shrink-0"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
    <div th:if="${warningMessage}" class="alert alert-warning alert-dismissible d-flex align-items-center" role="alert">
        <i class="fas fa-exclamation-triangle me-2 flex-shrink-0"></i>
        <span th:text="${warningMessage}"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
    <div th:if="${infoMessage}" class="alert alert-info alert-dismissible d-flex align-items-center" role="alert">
        <i class="fas fa-info-circle me-2 flex-shrink-0"></i>
        <span th:text="${infoMessage}"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
</div>

<!-- ===== SCRIPTS FRAGMENT ===== -->
<div th:fragment="scripts">
    <script th:src="@{/js/scripts.js}"></script>
</div>

</body>
</html>
