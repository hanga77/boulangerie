<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rapport Production')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="flex-grow-1 container-fluid px-3 px-md-4 py-4">

    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-industry me-2 text-success"></i>Rapport Production</h1>
            <p class="text-muted small mb-0">Synthèse des productions sur la période</p>
        </div>
        <div class="d-flex gap-2">
            <a href="/rapports/stocks" class="btn btn-outline-secondary btn-sm">Stocks</a>
            <a href="/rapports/livraisons" class="btn btn-outline-secondary btn-sm">Livraisons</a>
        </div>
    </div>

    <!-- Filtre -->
    <form method="get" class="card shadow-sm mb-4">
        <div class="card-body py-3">
            <div class="row g-2 align-items-end">
                <div class="col-12 col-sm-4">
                    <label class="form-label small fw-semibold mb-1">Du</label>
                    <input type="date" name="debut" class="form-control form-control-sm" th:value="${debut}">
                </div>
                <div class="col-12 col-sm-4">
                    <label class="form-label small fw-semibold mb-1">Au</label>
                    <input type="date" name="fin" class="form-control form-control-sm" th:value="${fin}">
                </div>
                <div class="col-12 col-sm-4">
                    <button type="submit" class="btn btn-primary btn-sm w-100">
                        <i class="fas fa-filter me-1"></i>Appliquer
                    </button>
                </div>
            </div>
        </div>
    </form>

    <!-- KPIs -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-4">
            <div class="card text-center border-0 shadow-sm">
                <div class="card-body py-3">
                    <div class="text-muted small">Productions</div>
                    <div class="fw-bold fs-3 text-success" th:text="${#lists.size(productions)}">0</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-4">
            <div class="card text-center border-0 shadow-sm">
                <div class="card-body py-3">
                    <div class="text-muted small">Coût total production</div>
                    <div class="fw-bold fs-5 text-danger"
                         th:text="${#numbers.formatDecimal(coutTotal, 0, 'COMMA', 0, 'POINT') + ' XAF'}">0</div>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-4">
            <div class="card text-center border-0 shadow-sm">
                <div class="card-body py-3">
                    <div class="text-muted small">Coût moyen / production</div>
                    <div class="fw-bold fs-5 text-warning"
                         th:text="${#lists.size(productions) > 0 ? #numbers.formatDecimal(coutTotal / #lists.size(productions), 0, 'COMMA', 0, 'POINT') + ' XAF' : '—'}">—</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tableau productions -->
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h6 class="mb-0 fw-semibold">
                <i class="fas fa-list me-2 text-muted"></i>Détail des productions
            </h6>
            <span class="badge bg-secondary" th:text="${#lists.size(productions)} + ' prod.'"></span>
        </div>

        <div th:if="${#lists.isEmpty(productions)}" class="card-body text-center py-5 text-muted">
            <i class="fas fa-industry fa-3x mb-3 d-block opacity-25"></i>
            Aucune production sur cette période.
        </div>

        <div th:unless="${#lists.isEmpty(productions)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th class="d-none d-md-table-cell">Responsable</th>
                    <th class="text-end">Nb produits</th>
                    <th class="text-end d-none d-md-table-cell">Nb matières</th>
                    <th class="text-center">Livraisons restantes</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productions}">
                    <td class="fw-semibold" th:text="${p.dateProduction}"></td>
                    <td class="d-none d-md-table-cell text-muted small"
                        th:text="${p.user != null ? p.user.username : '—'}"></td>
                    <td class="text-end">
                        <span class="badge bg-primary rounded-pill"
                              th:text="${#maps.size(p.produitsProduits)}"></span>
                    </td>
                    <td class="text-end d-none d-md-table-cell">
                        <span class="badge bg-secondary rounded-pill"
                              th:text="${#maps.size(p.matieresPremieresUtilisees)}"></span>
                    </td>
                    <td class="text-center">
                        <span th:with="total=${p.produitsProduits.values().stream().mapToInt(v -> v).sum()},
                                       restant=${p.produitsRestants.values().stream().mapToInt(v -> v).sum()}"
                              th:classappend="${restant == 0} ? 'badge bg-success' : 'badge bg-warning text-dark'"
                              th:text="${restant == 0 ? 'Tout livré' : restant + ' restant(s)'}">
                        </span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/production/details/{id}(id=${p.id})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="fas fa-eye me-1"></i>Détail
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
