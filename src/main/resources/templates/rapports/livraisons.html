<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rapport Livraisons')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="flex-grow-1 container-fluid px-3 px-md-4 py-4">

    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-truck me-2 text-info"></i>Rapport Livraisons</h1>
            <p class="text-muted small mb-0">Synthèse des livraisons sur la période</p>
        </div>
        <div class="d-flex gap-2">
            <a href="/rapports/stocks" class="btn btn-outline-secondary btn-sm">Stocks</a>
            <a href="/rapports/production" class="btn btn-outline-secondary btn-sm">Production</a>
        </div>
    </div>

    <!-- Filtre -->
    <form method="get" class="card shadow-sm mb-4">
        <div class="card-body py-3">
            <div class="row g-2 align-items-end">
                <div class="col-12 col-sm-4">
                    <label class="form-label small fw-semibold mb-1">Du</label>
                    <input type="date" name="debut" class="form-control form-control-sm" th:value="${debut}">
                </div>
                <div class="col-12 col-sm-4">
                    <label class="form-label small fw-semibold mb-1">Au</label>
                    <input type="date" name="fin" class="form-control form-control-sm" th:value="${fin}">
                </div>
                <div class="col-12 col-sm-4">
                    <button type="submit" class="btn btn-primary btn-sm w-100">
                        <i class="fas fa-filter me-1"></i>Appliquer
                    </button>
                </div>
            </div>
        </div>
    </form>

    <!-- KPIs -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-4">
            <div class="card text-center border-0 shadow-sm">
                <div class="card-body py-3">
                    <div class="text-muted small">Livraisons</div>
                    <div class="fw-bold fs-3 text-info" th:text="${#lists.size(livraisons)}">0</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-4">
            <div class="card text-center border-0 shadow-sm">
                <div class="card-body py-3">
                    <div class="text-muted small">Chiffre d'affaires</div>
                    <div class="fw-bold fs-5 text-success"
                         th:text="${#numbers.formatDecimal(chiffreAffaires, 0, 'COMMA', 0, 'POINT') + ' XAF'}">0</div>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-4">
            <div class="card text-center border-0 shadow-sm">
                <div class="card-body py-3">
                    <div class="text-muted small">Montant moyen / livraison</div>
                    <div class="fw-bold fs-5 text-primary"
                         th:text="${#lists.size(livraisons) > 0 ? #numbers.formatDecimal(chiffreAffaires / #lists.size(livraisons), 0, 'COMMA', 0, 'POINT') + ' XAF' : '—'}">—</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tableau livraisons -->
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h6 class="mb-0 fw-semibold">
                <i class="fas fa-list me-2 text-muted"></i>Détail des livraisons
            </h6>
            <span class="badge bg-secondary" th:text="${#lists.size(livraisons)} + ' livraison(s)'"></span>
        </div>

        <div th:if="${#lists.isEmpty(livraisons)}" class="card-body text-center py-5 text-muted">
            <i class="fas fa-truck fa-3x mb-3 d-block opacity-25"></i>
            Aucune livraison sur cette période.
        </div>

        <div th:unless="${#lists.isEmpty(livraisons)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>Client</th>
                    <th class="d-none d-md-table-cell text-end">Nb produits</th>
                    <th class="text-end">Montant</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="l : ${livraisons}">
                    <td class="text-muted small" th:text="${l.dateLivraison}"></td>
                    <td class="fw-semibold" th:text="${l.nomClient}"></td>
                    <td class="d-none d-md-table-cell text-end">
                        <span class="badge bg-primary rounded-pill"
                              th:text="${#maps.size(l.produitsLivres)}"></span>
                    </td>
                    <td class="text-end fw-bold text-success"
                        th:text="${#numbers.formatDecimal(l.montantTotal, 0, 'COMMA', 0, 'POINT') + ' XAF'}"></td>
                    <td class="text-end">
                        <a th:href="@{/livraisons/{id}/imprimer(id=${l.id})}"
                           class="btn btn-sm btn-outline-secondary" target="_blank" title="Télécharger facture">
                            <i class="fas fa-file-pdf"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
                <tfoot class="table-light">
                <tr>
                    <td colspan="3" class="fw-bold">Total</td>
                    <td class="text-end fw-bold text-success"
                        th:text="${#numbers.formatDecimal(chiffreAffaires, 0, 'COMMA', 0, 'POINT') + ' XAF'}"></td>
                    <td></td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>

</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
