<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Fournisseurs')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">

    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0">
                <i class="fas fa-truck-loading me-2 text-primary"></i>Fournisseurs
            </h1>
            <p class="text-muted small mb-0">Gestion des fournisseurs et contacts</p>
        </div>
        <div class="d-flex gap-2">
            <a href="/fournisseurs/dettes" class="btn btn-outline-danger btn-sm">
                <i class="fas fa-hand-holding-usd me-1"></i>Dettes
            </a>
            <a href="/fournisseurs/new" class="btn btn-primary btn-sm">
                <i class="fas fa-plus me-1"></i>Nouveau fournisseur
            </a>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nom</th>
                    <th class="d-none d-md-table-cell">Contact</th>
                    <th class="d-none d-md-table-cell">Téléphone</th>
                    <th class="d-none d-lg-table-cell">Catégorie</th>
                    <th class="d-none d-md-table-cell text-end">Dette en cours</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="f : ${fournisseurs}">
                    <td>
                        <div class="fw-semibold" th:text="${f.nom}"></div>
                        <div class="text-muted small d-md-none" th:text="${f.telephone}"></div>
                    </td>
                    <td class="d-none d-md-table-cell text-muted small" th:text="${f.referenceContact}"></td>
                    <td class="d-none d-md-table-cell" th:text="${f.telephone}"></td>
                    <td class="d-none d-lg-table-cell">
                        <span class="badge bg-secondary" th:text="${f.categorieProduits}"></span>
                    </td>
                    <td class="d-none d-md-table-cell text-end">
                        <span th:with="dette=${dettesParFournisseur[f.id]}"
                              th:if="${dette != null and dette > 0}"
                              class="badge bg-danger"
                              th:text="${#numbers.formatDecimal(dette, 0, 'COMMA', 0, 'POINT') + ' XAF'}"></span>
                        <span th:unless="${dettesParFournisseur[f.id] != null and dettesParFournisseur[f.id] > 0}"
                              class="text-muted small">—</span>
                    </td>
                    <td class="text-end">
                        <div class="d-flex justify-content-end gap-1 flex-wrap">
                            <a th:href="@{/fournisseurs/{id}(id=${f.id})}"
                               class="btn btn-outline-primary btn-sm" title="Voir détails & dettes">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a th:href="@{/fournisseurs/edit/{id}(id=${f.id})}"
                               class="btn btn-warning btn-sm">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{/fournisseurs/delete/{id}(id=${f.id})}" method="post"
                                  onsubmit="return confirm('Supprimer ce fournisseur ?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(fournisseurs)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        <i class="fas fa-truck fa-2x d-block mb-2 opacity-25"></i>
                        Aucun fournisseur enregistré
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
