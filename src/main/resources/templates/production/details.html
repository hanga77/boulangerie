<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Détails de la Production')}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div th:replace="~{fragments/layout :: flash-messages}"></div>

<div th:replace="~{fragments/layout :: legacy-banner(
    'Module Production historique (V1). Le farinage et la feuille magasinier se gèrent dans le Cycle du jour (V2).',
    '/cycle',
    'Aller au Cycle V2')}"></div>

<div class="container mt-4">
    <h1 class="mb-4">Détails de la Production</h1>
    <p>Date de production: <span th:text="${production.dateProduction}"></span></p>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-header bg-info text-white">
                    <i class="fas fa-boxes me-2"></i>Produits fabriqués
                </div>
                <div class="card-body">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" th:each="entry : ${production.produitsProduits}">
                            <span th:text="${produits != null and produits.get(entry.key) != null ? produits.get(entry.key).nom : entry.key}"></span>
                            <span class="float-end fw-semibold" th:text="${entry.value}"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-header bg-secondary text-white">
                    <i class="fas fa-leaf me-2"></i>Matières utilisées
                </div>
                <div class="card-body">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" th:each="entry : ${production.matieresPremieresUtilisees}">
                            <span th:text="${matieres != null and matieres.get(entry.key) != null ? matieres.get(entry.key).nom : entry.key}"></span>
                            <span class="float-end fw-semibold" th:text="${entry.value}"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-header">Actions</div>
                <div class="card-body d-grid gap-2">
                    <a href="/cycle" class="btn btn-success btn-sm">Cycle du jour (V2)</a>
                    <a href="/production" class="btn btn-outline-secondary btn-sm">Retour productions V1</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
