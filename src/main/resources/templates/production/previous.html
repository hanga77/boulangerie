<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Productions Précédentes')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">

    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0">
                <i class="fas fa-history me-2 text-primary"></i>Productions Précédentes
            </h1>
            <p class="text-muted small mb-0">Historique de production</p>
        </div>
        <a href="/production/passer-a-la-production" sec:authorize="hasRole('BOULANGER')" class="btn btn-primary btn-sm">
            <i class="fas fa-play-circle me-1"></i>Nouvelle production
        </a>
    </div>

    <!-- Filtrage par date -->
    <div class="card mb-3">
        <div class="card-body py-3">
            <form th:action="@{/production/previous}" method="get">
                <div class="row g-2 align-items-end">
                    <div class="col-12 col-md-4">
                        <label for="startDate" class="form-label">Du</label>
                        <input type="date" id="startDate" name="startDate" class="form-control form-control-sm"
                               th:value="${startDate}"/>
                    </div>
                    <div class="col-12 col-md-4">
                        <label for="endDate" class="form-label">Au</label>
                        <input type="date" id="endDate" name="endDate" class="form-control form-control-sm"
                               th:value="${endDate}"/>
                    </div>
                    <div class="col-12 col-md-4">
                        <button type="submit" class="btn btn-primary btn-sm w-100 w-md-auto">
                            <i class="fas fa-filter me-1"></i>Filtrer
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>Produit(s)</th>
                    <th class="text-end d-none d-md-table-cell">Qté commandée</th>
                    <th class="text-end d-none d-md-table-cell">Qté produite</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="production : ${productions}">
                    <td class="text-nowrap" th:text="${production.dateProduction}"></td>
                    <td>
                        <span th:each="entry, i : ${production.produitsProduits}"
                              th:text="${entry.key.nom + (i.last ? '' : ', ')}"></span>
                    </td>
                    <td class="text-end d-none d-md-table-cell"
                        th:text="${production.quantiteCommandee}"></td>
                    <td class="text-end d-none d-md-table-cell">
                        <span th:each="entry : ${production.produitsProduits}"
                              th:text="${entry.value}"></span>
                    </td>
                    <td class="text-end">
                        <div class="d-flex justify-content-end gap-1">
                            <a class="btn btn-info btn-sm"
                               th:href="@{/production/details/{id}(id=${production.id})}">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a class="btn btn-outline-secondary btn-sm"
                               th:href="@{/production/print(id=${production.id})}">
                                <i class="fas fa-print"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productions)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        <i class="fas fa-history fa-2x d-block mb-2 opacity-25"></i>
                        Aucune production dans cette période
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer bg-transparent" th:if="${totalPages > 1}">
            <nav aria-label="Pagination productions">
                <ul class="pagination pagination-sm justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/production(page=${currentPage - 1}, size=${size}, startDate=${startDate}, endDate=${endDate})}">&laquo;</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                           th:href="@{/production(page=${i}, size=${size}, startDate=${startDate}, endDate=${endDate})}"
                           th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/production(page=${currentPage + 1}, size=${size}, startDate=${startDate}, endDate=${endDate})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
