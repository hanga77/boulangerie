<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Incidents de production')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<div th:replace="~{fragments/layout :: legacy-banner(
    'Incidents liés à la production. Pour le flux du jour, utilisez le Cycle V2 ; ce module reste utile pour l’historique.',
    '/cycle',
    'Cycle du jour')}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">

    <div class="page-header mb-4">
        <div>
            <h1 class="h4 fw-bold mb-0">
                <i class="fas fa-exclamation-triangle me-2 text-warning"></i>Incidents de production
            </h1>
            <p class="text-muted small mb-0">Historique des avaries et pertes signalées</p>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/production/incidents}" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">Du</label>
                    <input type="date" name="debut" class="form-control form-control-sm" th:value="${debut}">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">Au</label>
                    <input type="date" name="fin" class="form-control form-control-sm" th:value="${fin}">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary btn-sm w-100">Filtrer</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Quantité</th>
                    <th>Statut</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="i : ${incidents}">
                    <td th:text="${i.dateIncident != null ? i.dateIncident : i.date}"></td>
                    <td th:text="${i.description}"></td>
                    <td th:text="${i.quantite}"></td>
                    <td th:text="${i.statut}"></td>
                </tr>
                <tr th:if="${incidents == null or #lists.isEmpty(incidents)}">
                    <td colspan="4" class="empty-state">Aucun incident</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
