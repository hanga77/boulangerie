<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Confirmation de production')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="flex-grow-1 container-fluid px-3 px-md-4 py-4">

    <div class="d-flex align-items-center gap-2 mb-4">
        <div class="rounded-circle bg-warning bg-opacity-10 p-3">
            <i class="fas fa-clipboard-check fa-lg text-warning"></i>
        </div>
        <div>
            <h1 class="h4 fw-bold mb-0">Confirmation de production</h1>
            <p class="text-muted small mb-0">
                Date : <strong th:text="${production.dateProduction}"></strong>
            </p>
        </div>
    </div>

    <div th:if="${warning}" class="alert alert-warning d-flex align-items-center gap-2">
        <i class="fas fa-exclamation-triangle flex-shrink-0"></i>
        <span th:text="${warning}"></span>
    </div>

    <!-- Résumé théorique -->
    <div class="row g-3 mb-4">
        <div class="col-12 col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-primary text-white py-3">
                    <h6 class="mb-0"><i class="fas fa-boxes me-2"></i>Produits à produire</h6>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Produit</th>
                            <th class="text-end">Qté prévue</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="entry : ${production.produitsProduits}">
                            <td th:text="${produits.get(entry.key).nom}"></td>
                            <td class="text-end fw-semibold" th:text="${entry.value}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-secondary text-white py-3">
                    <h6 class="mb-0"><i class="fas fa-leaf me-2"></i>Matières premières théoriques</h6>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Matière</th>
                            <th class="text-end">Qté théorique</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="entry : ${production.matieresPremieresUtilisees}">
                            <td th:text="${matieres.get(entry.key).nom}"></td>
                            <td class="text-end fw-semibold">
                                <span th:text="${#numbers.formatDecimal(entry.value, 1, 'COMMA', 2, 'POINT')}"></span>
                                <span class="text-muted small" th:text="${matieres.get(entry.key).uniteMesure}"></span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Formulaire saisie quantités réelles -->
    <form th:action="@{/production/valider-production}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:name="productionId" th:value="${production.id}"/>

        <div class="row g-3">
            <div class="col-12 col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-warning bg-opacity-75 py-3">
                        <h6 class="mb-0 fw-semibold">
                            <i class="fas fa-edit me-2"></i>Quantités réelles — Matières
                        </h6>
                    </div>
                    <div class="card-body">
                        <div th:each="entry : ${production.matieresPremieresUtilisees}" class="mb-3">
                            <label class="form-label fw-semibold small">
                                <span th:text="${matieres.get(entry.key).nom}"></span>
                                <span class="text-muted fw-normal"
                                      th:text="${'(' + matieres.get(entry.key).uniteMesure + ')'}"></span>
                            </label>
                            <div class="input-group input-group-sm">
                                <input type="number" step="0.01" min="0" class="form-control"
                                       th:name="${'quantitesReellesMatieres[' + entry.key + ']'}"
                                       th:value="${entry.value}"
                                       th:placeholder="${entry.value}">
                                <span class="input-group-text text-muted small"
                                      th:text="${matieres.get(entry.key).uniteMesure}"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-success bg-opacity-75 text-white py-3">
                        <h6 class="mb-0 fw-semibold">
                            <i class="fas fa-check-double me-2"></i>Quantités réelles — Produits
                        </h6>
                    </div>
                    <div class="card-body">
                        <div th:each="entry : ${production.produitsProduits}" class="mb-3">
                            <label class="form-label fw-semibold small"
                                   th:text="${produits.get(entry.key).nom}"></label>
                            <input type="number" min="0" class="form-control form-control-sm"
                                   th:name="${'quantitesReellesProduits[' + entry.key + ']'}"
                                   th:value="${entry.value}">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mt-4">
            <a href="/production" class="btn btn-outline-secondary">
                <i class="fas fa-times me-1"></i>Annuler
            </a>
            <button type="submit" class="btn btn-success">
                <i class="fas fa-check me-1"></i>Valider la production
            </button>
        </div>
    </form>

</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
