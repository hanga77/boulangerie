<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('KPIs')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">
    <div class="page-header">
        <h1 class="h4 fw-bold mb-0"><i class="fas fa-chart-line me-2 text-primary"></i>Indicateurs (KPIs)</h1>
        <a href="/comptabilite/dashboard" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Dashboard compta
        </a>
    </div>

    <div th:if="${kpisParCategorie == null or #maps.isEmpty(kpisParCategorie)}" class="card">
        <div class="empty-state">Aucun KPI disponible</div>
    </div>

    <div th:unless="${kpisParCategorie == null or #maps.isEmpty(kpisParCategorie)}">
        <div th:each="entry : ${kpisParCategorie}" class="mb-4">
            <h2 class="section-title" th:text="${entry.key}">Catégorie</h2>
            <div class="row g-3">
                <div class="col-6 col-md-3" th:each="kpi : ${entry.value}">
                    <div class="card h-100">
                        <div class="card-body text-center py-3">
                            <p class="text-muted small mb-1" th:text="${kpi.nom}"></p>
                            <div class="fs-4 fw-bold text-primary">
                                <span th:text="${#numbers.formatDecimal(kpi.valeur, 1, 2)}"></span>
                                <small class="fs-6 text-muted" th:text="${kpi.unite}"></small>
                            </div>
                            <p class="text-muted small mt-2 mb-0" th:text="${kpi.date}"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
