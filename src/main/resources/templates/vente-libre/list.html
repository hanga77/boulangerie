<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Ventes Libres')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">

    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-store me-2 text-success"></i>Ventes Libres</h1>
            <p class="text-muted small mb-0">Ventes directes en boulangerie</p>
        </div>
        <a href="/ventes-libres/new" class="btn btn-success btn-sm">
            <i class="fas fa-plus me-1"></i>Nouvelle vente
        </a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>Production</th>
                    <th class="d-none d-md-table-cell">Vendeur</th>
                    <th class="text-end">Montant</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="vente : ${ventesLibres}">
                    <td class="text-nowrap"
                        th:text="${#temporals.format(vente.dateVente, 'dd/MM/yyyy')}"></td>
                    <td>
                        <a th:href="@{/production/details/{id}(id=${vente.productionId})}"
                           class="text-decoration-none text-primary small">
                            Prod. #<span th:text="${vente.productionId}"></span>
                        </a>
                    </td>
                    <td class="d-none d-md-table-cell text-muted small"
                        th:text="${vente.vendeurUsername}"></td>
                    <td class="text-end fw-bold"
                        th:text="${vente.montantTotal + ' XAF'}"></td>
                    <td class="text-end">
                        <a th:href="@{/ventes-libres/{id}(id=${vente.id})}"
                           class="btn btn-info btn-sm">
                            <i class="fas fa-eye"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ventesLibres)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        <i class="fas fa-store fa-2x d-block mb-2 opacity-25"></i>
                        Aucune vente libre enregistrée
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
