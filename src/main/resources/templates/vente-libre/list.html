<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ventes libres')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>
<div th:replace="~{fragments/layout :: legacy-banner(
    'Ventes libres historiques (V1). Pour la caisse du jour liée à ProductionV2, utiliser Cycle → Caisse.',
    '/cycle/caisse',
    'Caisse V2')}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">

    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-store me-2 text-success"></i>Ventes libres (ancien)</h1>
            <p class="text-muted small mb-0">Historique V1</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a href="/cycle/caisse" class="btn btn-success btn-sm">
                <i class="fas fa-cash-register me-1"></i>Caisse V2
            </a>
            <a href="/ventes-libres/new" class="btn btn-outline-success btn-sm">
                <i class="fas fa-plus me-1"></i>Nouvelle (V1)
            </a>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>Production</th>
                    <th class="d-none d-md-table-cell">Vendeur</th>
                    <th class="text-end">Montant</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="vente : ${ventesLibres}">
                    <td class="text-nowrap"
                        th:text="${#temporals.format(vente.dateVente, 'dd/MM/yyyy')}"></td>
                    <td>
                        <a th:href="@{/production/details/{id}(id=${vente.productionId})}"
                           class="text-decoration-none text-primary small">
                            Prod. #<span th:text="${vente.productionId}"></span>
                        </a>
                    </td>
                    <td class="d-none d-md-table-cell text-muted small"
                        th:text="${vente.vendeurUsername}"></td>
                    <td class="text-end fw-bold"
                        th:text="${vente.montantTotal + ' XAF'}"></td>
                    <td class="text-end">
                        <a th:href="@{/ventes-libres/{id}(id=${vente.id})}"
                           class="btn btn-info btn-sm">
                            <i class="fas fa-eye"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ventesLibres)}">
                    <td colspan="5" class="empty-state">
                        <i class="fas fa-store"></i>
                        Aucune vente libre enregistrée
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
