<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nouveau produit')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">
    <div class="page-header">
        <h1 class="h4 fw-bold mb-0"><i class="fas fa-cookie-bite me-2 text-warning"></i>Nouveau produit</h1>
        <a href="/produits" class="btn btn-outline-secondary btn-sm">Retour liste</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/produits}" th:object="${produitDTO}" method="post" id="productForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nom" class="form-label">Nom du produit</label>
                        <input type="text" class="form-control" id="nom" th:field="*{nom}" required/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="prix" class="form-label">Prix (XAF)</label>
                        <input type="number" step="0.01" class="form-control" id="prix" th:field="*{prix}" required/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('prix')}" th:errors="*{prix}"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="quantiteProduit" class="form-label">Qté attendue</label>
                        <input type="number" step="0.01" class="form-control" id="quantiteProduit"
                               th:field="*{quantiteAttendue}" required/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('quantiteAttendue')}" th:errors="*{quantiteAttendue}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="quantiteVenteLibreJournaliere" class="form-label">Quota vente libre / jour</label>
                        <input type="number" min="0" class="form-control" id="quantiteVenteLibreJournaliere"
                               th:field="*{quantiteVenteLibreJournaliere}"/>
                        <div class="form-text">Quantité supplémentaire pour le comptoir.</div>
                    </div>
                </div>

                <hr class="my-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h6 fw-bold mb-0">Recette — matières premières</h2>
                    <button type="button" class="btn btn-outline-primary btn-sm" id="addMatiere">
                        <i class="fas fa-plus me-1"></i>Ajouter une matière
                    </button>
                </div>
                <div id="matieresList" class="mb-3"></div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save me-1"></i>Enregistrer
                    </button>
                    <a href="/produits" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:inline="javascript">
    /*<![CDATA[*/
    const matieres = [[${matieresPremieres}]];

    document.getElementById('addMatiere').addEventListener('click', function () {
        const matiereContainer = document.createElement('div');
        matiereContainer.className = 'row g-2 mb-2 align-items-center';
        matiereContainer.innerHTML = `
            <div class="col-md-5">
                <select class="form-select matiere-select" required>
                    <option value="">Sélectionner une matière</option>
                    ${matieres.map(m => `<option value="${m.id}" data-unite="${m.uniteMesure}">${m.nom}</option>`).join('')}
                </select>
            </div>
            <div class="col-md-5">
                <div class="input-group">
                    <input type="number" step="0.001" min="0" class="form-control matiere-quantity" required>
                    <span class="input-group-text unite-mesure">—</span>
                </div>
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-outline-danger w-100 remove-matiere"><i class="fas fa-trash"></i></button>
            </div>
            <input type="hidden" class="matiere-input">
        `;
        document.getElementById('matieresList').appendChild(matiereContainer);

        matiereContainer.querySelector('.matiere-select').addEventListener('change', function (e) {
            const matiere = matieres.find(m => m.id == e.target.value);
            if (matiere) {
                matiereContainer.querySelector('.unite-mesure').textContent = matiere.uniteMesure;
                updateFormField(matiereContainer);
            }
        });
        matiereContainer.querySelector('.matiere-quantity').addEventListener('input', function () {
            updateFormField(matiereContainer);
        });
        matiereContainer.querySelector('.remove-matiere').addEventListener('click', function () {
            matiereContainer.remove();
        });
    });

    function updateFormField(container) {
        const matiereId = container.querySelector('.matiere-select').value;
        const quantity = container.querySelector('.matiere-quantity').value;
        if (matiereId && quantity) {
            container.querySelector('.matiere-input').name = `matieresPremieres[${matiereId}]`;
            container.querySelector('.matiere-input').value = quantity;
        }
    }
    /*]]>*/
</script>
</body>
</html>
