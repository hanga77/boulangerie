<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Produits')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">

    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-cookie-bite me-2 text-warning"></i>Produits</h1>
            <p class="text-muted small mb-0">Catalogue et recettes</p>
        </div>
        <a href="/produits/new" class="btn btn-primary btn-sm">
            <i class="fas fa-plus me-1"></i>Nouveau produit
        </a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Produit</th>
                    <th class="text-end">Prix</th>
                    <th class="text-end d-none d-md-table-cell">Qté attendue</th>
                    <th class="text-end d-none d-lg-table-cell">Farine (kg)</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="produit : ${produits}">
                    <td class="fw-semibold" th:text="${produit.nom}"></td>
                    <td class="text-end fw-bold"
                        th:text="${#numbers.formatDecimal(produit.prix, 0, 'COMMA', 0, 'POINT') + ' XAF'}"></td>
                    <td class="text-end d-none d-md-table-cell" th:text="${produit.quantiteAttendue}"></td>
                    <td class="text-end d-none d-lg-table-cell text-muted small"
                        th:text="${farineQuantities.get(produit.id)}"></td>
                    <td class="text-end">
                        <div class="d-flex justify-content-end gap-1 flex-wrap">
                            <a th:href="@{/produits/edit/{id}(id=${produit.id})}"
                               class="btn btn-warning btn-sm">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{/produits/delete/{id}(id=${produit.id})}" method="post"
                                  onsubmit="return confirm('Supprimer ce produit ?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(produits)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        <i class="fas fa-cookie fa-2x d-block mb-2 opacity-25"></i>
                        Aucun produit enregistré
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer bg-transparent" th:if="${totalPages > 1}">
            <nav aria-label="Pagination produits">
                <ul class="pagination pagination-sm justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/produits(page=${currentPage - 1}, size=${size})}">&laquo;</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/produits(page=${i}, size=${size})}"
                           th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/produits(page=${currentPage + 1}, size=${size})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
