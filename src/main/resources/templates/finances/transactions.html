<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Transactions')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">
    <div class="page-header">
        <h1 class="h4 fw-bold mb-0"><i class="fas fa-list me-2 text-primary"></i>Transactions</h1>
        <a href="/finances" class="btn btn-outline-secondary btn-sm">Retour finances</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Description</th>
                    <th class="text-end">Montant</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="transaction : ${transactions}">
                    <td class="text-nowrap" th:text="${transaction.date}"></td>
                    <td><span class="badge text-bg-light border" th:text="${transaction.type}"></span></td>
                    <td th:text="${transaction.description}"></td>
                    <td class="text-end fw-semibold" th:text="${transaction.montant + ' XAF'}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(transactions)}">
                    <td colspan="4" class="empty-state">Aucune transaction</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
