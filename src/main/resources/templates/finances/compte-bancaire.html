<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Comptes Bancaires')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">

    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-university me-2 text-success"></i>Comptes bancaires</h1>
            <p class="text-muted small mb-0">Soldes, multi-comptes et virements internes (phase 9)</p>
        </div>
        <a sec:authorize="hasRole('ADMIN')" href="/compte-bancaire/creer" class="btn btn-primary btn-sm">
            <i class="fas fa-plus me-1"></i>Nouveau compte
        </a>
    </div>

    <div th:if="${comptes != null}">
        <div class="row g-3 mb-4" th:if="${comptePrincipal != null}">
            <div class="col-md-4">
                <div class="card border-success">
                    <div class="card-body">
                        <h6 class="card-subtitle text-muted mb-1">Compte Principal</h6>
                        <h3 class="card-title text-success fw-bold"
                            th:text="${comptePrincipal.solde + ' XAF'}">—</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="table-responsive">
                <table class="table table-sm table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Nom</th>
                        <th class="text-end">Solde</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${comptes}">
                        <td class="fw-semibold" th:text="${c.nom}"></td>
                        <td class="text-end fw-bold"
                            th:classappend="${c.solde < 0} ? 'text-danger' : 'text-success'"
                            th:text="${c.solde + ' XAF'}"></td>
                        <td class="text-end">
                            <a th:href="@{/compte-bancaire/{id}(id=${c.id})}" class="btn btn-outline-secondary btn-sm">
                                <i class="fas fa-eye"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(comptes)}">
                        <td colspan="3" class="empty-state">Aucun compte enregistré</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card" th:if="${comptes != null and #lists.size(comptes) >= 2}" sec:authorize="hasAnyRole('ADMIN','MANAGER')">
            <div class="card-header">Virement entre comptes</div>
            <div class="card-body">
                <form th:action="@{/compte-bancaire/transfert}" method="post" class="row g-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="col-md-3">
                        <label class="form-label">Depuis</label>
                        <select name="sourceId" class="form-select" required>
                            <option th:each="c : ${comptes}" th:value="${c.id}"
                                    th:text="${c.nom + ' (' + c.solde + ' XAF)'}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Vers</label>
                        <select name="destinationId" class="form-select" required>
                            <option th:each="c : ${comptes}" th:value="${c.id}"
                                    th:text="${c.nom}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Montant</label>
                        <input type="number" step="1" min="1" name="montant" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Libellé</label>
                        <input type="text" name="description" class="form-control" placeholder="Virement interne">
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100"
                                onclick="return confirm('Confirmer le virement ?');">OK</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:if="${compte != null}">
        <div class="card mb-3">
            <div class="card-header fw-semibold">
                <i class="fas fa-university me-2"></i><span th:text="${compte.nom}">Compte</span>
            </div>
            <div class="card-body">
                <p class="mb-0">Solde actuel :
                    <strong th:classappend="${compte.solde < 0} ? 'text-danger' : 'text-success'"
                            th:text="${compte.solde + ' XAF'}"></strong>
                </p>
            </div>
        </div>
        <a href="/compte-bancaire" class="btn btn-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Retour
        </a>
    </div>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
