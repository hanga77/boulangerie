<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nouveau compte')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container py-4 flex-grow-1" style="max-width:560px">
    <div class="page-header">
        <h1 class="h4 fw-bold mb-0"><i class="fas fa-university me-2 text-primary"></i>Créer un compte bancaire</h1>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/compte-bancaire/creer}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label for="nom" class="form-label">Nom du compte</label>
                    <input type="text" class="form-control" id="nom" name="nom"
                           placeholder="ex: Compte Principal" required>
                    <div class="form-text">Le nom <strong>Compte Principal</strong> est requis pour les flux automatiques.</div>
                </div>
                <div class="mb-4">
                    <label for="soldeInitial" class="form-label">Solde initial (XAF)</label>
                    <input type="number" step="0.01" class="form-control" id="soldeInitial" name="soldeInitial" required>
                </div>
                <div class="d-flex justify-content-between gap-2">
                    <a href="/finances" class="btn btn-outline-secondary">Annuler</a>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Créer</button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
