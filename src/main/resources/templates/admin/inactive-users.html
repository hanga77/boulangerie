<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Utilisateurs en attente')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">
    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0">
                <i class="fas fa-user-clock me-2 text-warning"></i>Utilisateurs en attente d'activation
            </h1>
            <p class="text-muted small mb-0">Comptes inscrits non encore activés</p>
        </div>
        <a href="/admin/users" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Tous les utilisateurs
        </a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Identifiant</th>
                    <th class="d-none d-md-table-cell">Créé le</th>
                    <th>Rôle</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${inactiveUsers}">
                    <td class="fw-semibold" th:text="${user.username}"></td>
                    <td class="d-none d-md-table-cell text-muted small"
                        th:text="${user.creationDate != null ? #temporals.format(user.creationDate, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                    <td>
                        <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" class="d-flex gap-1 align-items-center">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <select name="role" class="form-select form-select-sm" style="max-width:11rem">
                                <option value="BOULANGER" th:selected="${user.role == 'BOULANGER'}">Boulanger</option>
                                <option value="MAGASINIER" th:selected="${user.role == 'MAGASINIER'}">Magasinier</option>
                                <option value="CAISSIER" th:selected="${user.role == 'CAISSIER'}">Caissier</option>
                                <option value="POINT_DE_VENTE" th:selected="${user.role == 'POINT_DE_VENTE'}">Point de vente</option>
                                <option value="MANAGER" th:selected="${user.role == 'MANAGER'}">Manager</option>
                                <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">Admin</option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-outline-secondary" title="Appliquer le rôle">
                                <i class="fas fa-check"></i>
                            </button>
                        </form>
                    </td>
                    <td class="text-end">
                        <div class="d-flex justify-content-end gap-1 flex-wrap">
                            <form th:action="@{/admin/users/{id}/activate(id=${user.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-success btn-sm">
                                    <i class="fas fa-user-check me-1"></i>Activer
                                </button>
                            </form>
                            <form th:action="@{/admin/users/{id}(id=${user.id})}" method="post"
                                  onsubmit="return confirm('Supprimer cet utilisateur ?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="_method" value="DELETE"/>
                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(inactiveUsers)}">
                    <td colspan="4" class="empty-state">Aucun utilisateur en attente</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
