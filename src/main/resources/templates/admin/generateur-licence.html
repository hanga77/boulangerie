<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Générateur de clé')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<div class="container mt-4" style="max-width:560px">

    <div class="d-flex align-items-center gap-2 mb-4">
        <div class="rounded-circle bg-primary bg-opacity-10 p-3">
            <i class="fas fa-key fa-lg text-primary"></i>
        </div>
        <div>
            <h1 class="h4 fw-bold mb-0">Générateur de clé de licence</h1>
            <p class="text-muted small mb-0">Réservé au revendeur — usage interne</p>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <p class="small text-muted mb-3">
                Saisissez l'<strong>ID Poste</strong> communiqué par le client depuis sa page
                <code>/admin/licence</code>.
            </p>
            <form method="get" action="/admin/licence/generateur" class="d-flex gap-2">
                <input type="text" name="machineId" class="form-control font-monospace text-uppercase"
                       placeholder="Ex : A3F7B2C1"
                       th:value="${machineId}"
                       maxlength="16" required autocomplete="off"
                       style="letter-spacing:.1em">
                <button type="submit" class="btn btn-primary text-nowrap">
                    <i class="fas fa-cogs me-1"></i>Générer
                </button>
            </form>
        </div>
    </div>

    <!-- Résultat -->
    <div th:if="${cleGeneree}" class="card border-success shadow-sm">
        <div class="card-header bg-success bg-opacity-10 text-success fw-semibold">
            <i class="fas fa-check-circle me-2"></i>Clé générée pour le poste
            <span class="font-monospace" th:text="${machineId}"></span>
        </div>
        <div class="card-body">
            <div class="input-group">
                <input type="text" id="cleField" class="form-control font-monospace fw-bold fs-6"
                       th:value="${cleGeneree}" readonly>
                <button class="btn btn-outline-success" type="button" onclick="copierCle()" title="Copier">
                    <i class="fas fa-copy me-1"></i>Copier
                </button>
            </div>
            <div id="copyOk" class="text-success small mt-1" style="display:none">
                <i class="fas fa-check me-1"></i>Copié !
            </div>
            <p class="text-muted small mt-3 mb-0">
                <i class="fas fa-info-circle me-1"></i>
                Cette clé fonctionne <strong>uniquement</strong> sur le poste
                <span class="font-monospace" th:text="${machineId}"></span>.
                Transmettez-la au client par WhatsApp ou email.
            </p>
        </div>
    </div>

    <div class="mt-4">
        <a href="/admin/licence" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Retour à la licence
        </a>
    </div>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
function copierCle() {
    const val = document.getElementById('cleField').value;
    navigator.clipboard.writeText(val).then(() => {
        const el = document.getElementById('copyOk');
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 2500);
    });
}
</script>
</body>
</html>
