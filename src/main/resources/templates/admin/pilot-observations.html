<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Observations pilote')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">
    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-list-check me-2 text-primary"></i>Observations pilote</h1>
            <p class="text-muted small mb-0">Historique des retours terrain (phase 7)</p>
        </div>
        <div class="d-flex gap-2">
            <form method="get" class="d-flex gap-2">
                <input type="date" name="date" class="form-control form-control-sm" th:value="${date}">
                <button class="btn btn-outline-secondary btn-sm" type="submit">Filtrer</button>
            </form>
            <a href="/admin/pilot" class="btn btn-primary btn-sm">Guide pilote</a>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Jour</th>
                    <th>Étape</th>
                    <th>Statut</th>
                    <th>Commentaire</th>
                    <th>Auteur</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${observations}">
                    <td th:text="${o.dateJour}"></td>
                    <td th:text="${labels[o.etape] ?: o.etape}"></td>
                    <td>
                        <span class="badge" th:classappend="${o.ok} ? 'bg-success' : 'bg-danger'"
                              th:text="${o.ok} ? 'OK' : 'Problème'">OK</span>
                    </td>
                    <td th:text="${o.commentaire}"></td>
                    <td class="text-muted small" th:text="${o.auteur}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(observations)}">
                    <td colspan="5" class="empty-state">Aucune observation</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
