<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Matières premières nécessaires')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">

    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0">
                <i class="fas fa-boxes me-2 text-warning"></i>Matières premières nécessaires
            </h1>
            <p class="text-muted small mb-0">Calcul basé sur les commandes non traitées</p>
        </div>
        <a href="/commandes" class="btn btn-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Retour
        </a>
    </div>

    <!-- Formulaire de sélection de date -->
    <div class="card mb-3">
        <div class="card-body">
            <form method="get" action="/commandes/matieres-premieres" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label for="date" class="form-label fw-semibold">Date de production</label>
                    <input type="date" id="date" name="date" class="form-control" required
                           th:value="${#temporals.format(date, 'yyyy-MM-dd') ?: ''}" />
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-calculator me-1"></i>Calculer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Résultats -->
    <div class="card" th:if="${matieresNecessaires != null}">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Matière première</th>
                    <th class="text-end">Quantité nécessaire</th>
                    <th>Unité</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${matieresNecessaires}">
                    <td th:text="${entry.key.nom}" class="fw-semibold"></td>
                    <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(entry.value, 1, 2)}"></td>
                    <td th:text="${entry.key.unite}" class="text-muted"></td>
                </tr>
                <tr th:if="${#maps.isEmpty(matieresNecessaires)}">
                    <td colspan="3" class="text-center text-muted py-4">
                        Aucune commande non traitée pour cette date.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
