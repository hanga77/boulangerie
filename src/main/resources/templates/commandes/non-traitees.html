<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Commandes Non Traitées')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">
    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-clipboard-list me-2 text-warning"></i>Commandes non traitées</h1>
        </div>
        <a href="/commandes" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Retour liste
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Date</th>
                    <th>Point de vente</th>
                    <th>Produits</th>
                    <th>Coût total</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(commandes)}">
                    <td colspan="6" class="text-center text-muted py-4">Aucune commande non traitée.</td>
                </tr>
                <tr th:each="commande : ${commandes}">
                    <td th:text="${commande.id}"></td>
                    <td th:text="${commande.dateCommande}"></td>
                    <td th:text="${commande.nomPointDeVente}"></td>
                    <td>
                        <ul class="mb-0 small">
                            <li th:each="produit : ${commande.nomsProduits}">
                                <span th:text="${produit.value}"></span>
                                (qté: <span th:text="${commande.produitsCommandes.get(produit.key)}"></span>)
                            </li>
                        </ul>
                    </td>
                    <td th:text="${commande.coutTotal}"></td>
                    <td class="text-end">
                        <a th:href="@{/commandes/view/{id}(id=${commande.id})}" class="btn btn-outline-primary btn-sm">Détails</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
