<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Commandes')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">

    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-shopping-cart me-2 text-primary"></i>Commandes</h1>
            <p class="text-muted small mb-0">Gestion des commandes par point de vente</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a th:if="${!#lists.isEmpty(commandes)}" th:href="@{/commandes/non-traitees}"
               class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-list me-1"></i>Non traitées
            </a>
            <a href="/production/passer-a-la-production" class="btn btn-success btn-sm">
                <i class="fas fa-industry me-1"></i>Démarrer prod.
            </a>
            <a href="/commandes/new" class="btn btn-primary btn-sm">
                <i class="fas fa-plus me-1"></i>Nouvelle commande
            </a>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>Point de vente</th>
                    <th class="text-end">Montant</th>
                    <th class="text-center">Statut</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="commande : ${commandes}">
                    <td th:text="${commande.dateCommande}" class="text-nowrap"></td>
                    <td th:text="${commande.nomPointDeVente}"></td>
                    <td class="text-end fw-bold"
                        th:text="${commande.coutTotal != null ? commande.coutTotal + ' XAF' : '—'}"></td>
                    <td class="text-center">
                        <span th:if="${commande.processed}" class="badge bg-success">Traitée</span>
                        <span th:unless="${commande.processed}" class="badge bg-warning text-dark">En attente</span>
                    </td>
                    <td class="text-end">
                        <div class="btn-group-actions d-flex justify-content-end gap-1 flex-wrap">
                            <a th:href="@{/commandes/view/{id}(id=${commande.id})}"
                               class="btn btn-info btn-sm">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a th:if="${!commande.processed}"
                               th:href="@{/commandes/edit/{id}(id=${commande.id})}"
                               class="btn btn-warning btn-sm">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:if="${!commande.processed}"
                                  th:action="@{/commandes/delete/{id}(id=${commande.id})}" method="post"
                                  onsubmit="return confirm('Supprimer cette commande ?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(commandes)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        <i class="fas fa-inbox fa-2x d-block mb-2 opacity-25"></i>
                        Aucune commande enregistrée
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="card-footer bg-transparent" th:if="${totalPages > 1}">
            <nav aria-label="Pagination commandes">
                <ul class="pagination pagination-sm justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/commandes(page=${currentPage - 1}, size=${size})}">&laquo;</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/commandes(page=${i}, size=${size})}"
                           th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/commandes(page=${currentPage + 1}, size=${size})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
