<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Modifier une Commande')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">
    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-edit me-2 text-primary"></i>Modifier une commande</h1>
        </div>
        <a href="/commandes" class="btn btn-outline-secondary btn-sm">Retour</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/commandes/update/{id}(id=${commandeDTO.id})}" th:object="${commandeDTO}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label for="dateCommande" class="form-label">Date de la commande</label>
                    <input type="date" id="dateCommande" th:field="*{dateCommande}" class="form-control" required />
                    <div class="text-danger" th:if="${#fields.hasErrors('dateCommande')}" th:errors="*{dateCommande}"></div>
                </div>
                <div class="mb-3">
                    <label for="pointDeVenteId" class="form-label">Point de vente</label>
                    <select id="pointDeVenteId" th:field="*{pointDeVenteId}" class="form-select" required>
                        <option value="">-- Choisir un point de vente --</option>
                        <option th:each="pdv : ${pointsDeVente}"
                                th:value="${pdv.id}"
                                th:text="${pdv.nom}"></option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('pointDeVenteId')}" th:errors="*{pointDeVenteId}"></div>
                </div>
                <div class="mb-3">
                    <label for="guichetId" class="form-label">Guichet (optionnel)</label>
                    <select id="guichetId" th:field="*{guichetId}" class="form-select">
                        <option value="">-- Aucun guichet --</option>
                        <option th:each="g : ${guichets}"
                                th:value="${g.id}"
                                th:text="${g.nom}"></option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>Enregistrer
                    </button>
                    <a href="/commandes" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
