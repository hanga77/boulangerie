<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Détail commande')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">
    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0">
                <i class="fas fa-file-alt me-2 text-primary"></i>
                Commande — <span th:text="${commande.nomPointDeVente}">PDV</span>
            </h1>
            <p class="text-muted small mb-0">
                Date : <span th:text="${commande.dateCommande}"></span>
            </p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/commande/imprimer(id=${commande.id})}" class="btn btn-outline-primary btn-sm">
                <i class="fas fa-print me-1"></i>Imprimer
            </a>
            <a href="/commandes" class="btn btn-secondary btn-sm">
                <i class="fas fa-arrow-left me-1"></i>Liste
            </a>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-4">
            <div class="card h-100"><div class="card-body">
                <div class="text-muted small">Point de vente</div>
                <div class="fw-semibold" th:text="${commande.nomPointDeVente}"></div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card h-100"><div class="card-body">
                <div class="text-muted small">Date</div>
                <div class="fw-semibold" th:text="${commande.dateCommande}"></div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 border-success"><div class="card-body">
                <div class="text-muted small">Montant total</div>
                <div class="fs-5 fw-bold text-success"
                     th:text="${commande.coutTotal != null ? commande.coutTotal + ' XAF' : '—'}"></div>
            </div></div>
        </div>
    </div>

    <div class="card mt-3">
        <div class="card-header">Produits commandés</div>
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Produit</th>
                    <th class="text-end">Quantité</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="produit : ${produitsAvecNoms}">
                    <td th:text="${produit.key.nom}"></td>
                    <td class="text-end fw-semibold" th:text="${produit.value}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(produitsAvecNoms)}">
                    <td colspan="2" class="empty-state py-4">Aucun produit</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
