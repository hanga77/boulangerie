<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Employé')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container py-4 flex-grow-1" style="max-width:640px">
    <div class="page-header">
        <h1 class="h4 fw-bold mb-0">
            <i class="fas fa-user-edit me-2 text-primary"></i>
            <span th:text="${employe.id == null ? 'Nouvel employé' : 'Modifier l\'employé'}"></span>
        </h1>
        <a href="/employes" class="btn btn-outline-secondary btn-sm">Retour</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="${employe.id == null ? '/employes/nouveau' : '/employes/' + employe.id + '/modifier'}"
                  method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nom <span class="text-danger">*</span></label>
                        <input type="text" name="nom" class="form-control" th:value="${employe.nom}" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Prénom <span class="text-danger">*</span></label>
                        <input type="text" name="prenom" class="form-control" th:value="${employe.prenom}" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Poste <span class="text-danger">*</span></label>
                        <input type="text" name="poste" class="form-control" th:value="${employe.poste}"
                               placeholder="ex. Boulanger" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Salaire de base (XAF) <span class="text-danger">*</span></label>
                        <input type="number" name="salaireBase" class="form-control"
                               th:value="${employe.salaireBase}" min="0" step="500" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Date d'embauche</label>
                        <input type="date" name="dateEmbauche" class="form-control" th:value="${employe.dateEmbauche}"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">N° CNPS</label>
                        <input type="text" name="numeroCnps" class="form-control" th:value="${employe.numeroCnps}"/>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Compte utilisateur lié</label>
                        <select name="userId" class="form-select">
                            <option value="">— Aucun —</option>
                            <option th:each="u : ${users}"
                                    th:value="${u.id}"
                                    th:text="${u.username + ' (' + u.role + ')'}"
                                    th:selected="${employe.user != null && employe.user.id == u.id}"></option>
                        </select>
                        <div class="form-text">Pour l'accès à « Mes bulletins ».</div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>Enregistrer
                    </button>
                    <a href="/employes" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
