<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mes bulletins')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">
    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0">
                <i class="fas fa-file-invoice-dollar me-2 text-primary"></i>Mes bulletins de paie
            </h1>
            <p class="text-muted small mb-0"
               th:if="${employe != null}"
               th:text="${employe.prenom + ' ' + employe.nom + ' — ' + employe.poste}"></p>
        </div>
    </div>

    <div th:if="${aucunProfil}" class="card">
        <div class="empty-state">
            <i class="fas fa-id-badge"></i>
            Aucun profil employé n'est lié à votre compte.
            Contactez un administrateur.
        </div>
    </div>

    <div th:unless="${aucunProfil}" class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Période</th>
                    <th class="text-end">Net</th>
                    <th>Statut</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bulletins}">
                    <td th:text="${#temporals.format(b.periode, 'MMMM yyyy')}"></td>
                    <td class="text-end fw-semibold"
                        th:text="${#numbers.formatDecimal(b.salaireNet, 1, 'COMMA', 0, 'POINT') + ' XAF'}"></td>
                    <td>
                        <span th:if="${b.statut.name() == 'GENERE'}" class="badge bg-warning text-dark">En attente</span>
                        <span th:if="${b.statut.name() == 'PAYE'}" class="badge bg-success">Payé</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/bulletins/{id}(id=${b.id})}" class="btn btn-outline-primary btn-sm">
                            <i class="fas fa-eye me-1"></i>Voir
                        </a>
                        <a th:href="@{/bulletins/{id}/pdf(id=${b.id})}" class="btn btn-outline-secondary btn-sm">
                            <i class="fas fa-file-pdf"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(bulletins)}">
                    <td colspan="4" class="empty-state">Aucun bulletin disponible</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
