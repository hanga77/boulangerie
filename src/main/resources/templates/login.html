<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>
<body class="d-flex align-items-center justify-content-center min-vh-100" style="background:var(--bs-body-bg)">

<div class="auth-card card p-4 p-md-5 mx-3">
    <div class="text-center mb-4">
        <i class="fas fa-bread-slice fa-2x text-primary mb-2"></i>
        <h1 class="h4 fw-bold mb-0">Boulangerie</h1>
        <p class="text-muted small">Connectez-vous à votre espace</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center" role="alert">
        <i class="fas fa-exclamation-circle me-2 flex-shrink-0"></i>
        <span>Nom d'utilisateur ou mot de passe incorrect.</span>
    </div>
    <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center" role="alert">
        <i class="fas fa-check-circle me-2 flex-shrink-0"></i>
        <span>Vous avez été déconnecté avec succès.</span>
    </div>
    <div th:if="${session.errorMessage}" class="alert alert-danger d-flex align-items-center" role="alert">
        <i class="fas fa-exclamation-circle me-2 flex-shrink-0"></i>
        <span th:text="${session.errorMessage}"></span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Nom d'utilisateur</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="Votre identifiant" required autofocus>
            </div>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Mot de passe</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Votre mot de passe" required>
            </div>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-sign-in-alt me-2"></i>Se connecter
            </button>
        </div>
    </form>

    <hr class="my-4">
    <p class="text-center text-muted small mb-0">
        Pas encore de compte ? <a href="/register" class="text-primary">S'inscrire</a>
    </p>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
