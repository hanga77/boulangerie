<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erreur serveur')}"></head>
<body class="auth-page d-flex flex-column min-vh-100">
<main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
    <div class="card border-0 shadow-sm text-center p-4 p-md-5" style="max-width:420px;width:100%;border-radius:16px">
        <div class="text-danger mb-3">
            <i class="fas fa-exclamation-triangle fa-3x"></i>
        </div>
        <h1 class="display-5 fw-bold text-danger mb-2">500</h1>
        <p class="text-muted mb-4">Une erreur interne s'est produite. Réessayez dans un instant ou contactez l'administrateur.</p>
        <div class="d-grid gap-2">
            <a href="/dashboard" class="btn btn-primary">
                <i class="fas fa-home me-1"></i>Retour à l'accueil
            </a>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="history.back()">
                Page précédente
            </button>
        </div>
    </div>
</main>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
