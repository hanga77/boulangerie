<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Points de Vente')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<main class="container-fluid px-3 px-md-4 py-4 flex-grow-1">

    <div class="page-header">
        <div>
            <h1 class="h4 fw-bold mb-0">
                <i class="fas fa-map-marker-alt me-2 text-danger"></i>Points de Vente
            </h1>
            <p class="text-muted small mb-0">Boutiques, marchés et dépôts</p>
        </div>
        <a href="/points-de-vente/new" class="btn btn-primary btn-sm">
            <i class="fas fa-plus me-1"></i>Nouveau point de vente
        </a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nom</th>
                    <th class="d-none d-md-table-cell">Type</th>
                    <th class="d-none d-lg-table-cell">Adresse</th>
                    <th class="text-center">Guichets</th>
                    <th class="text-center">Statut</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="pdv : ${pointsDeVente}">
                    <td class="fw-semibold" th:text="${pdv.nom}"></td>
                    <td class="d-none d-md-table-cell">
                        <span class="badge bg-secondary" th:text="${pdv.type}"></span>
                    </td>
                    <td class="d-none d-lg-table-cell text-muted small" th:text="${pdv.adresse}"></td>
                    <td class="text-center text-muted"
                        th:text="${pdv.guichets != null ? pdv.guichets.size() : 0}"></td>
                    <td class="text-center">
                        <span th:if="${pdv.actif}" class="badge bg-success">Actif</span>
                        <span th:unless="${pdv.actif}" class="badge bg-danger">Inactif</span>
                    </td>
                    <td class="text-end">
                        <div class="d-flex justify-content-end gap-1 flex-wrap">
                            <a th:href="@{/points-de-vente/{id}(id=${pdv.id})}"
                               class="btn btn-info btn-sm">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a th:href="@{/points-de-vente/edit/{id}(id=${pdv.id})}"
                               class="btn btn-warning btn-sm">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:if="${pdv.actif}"
                                  th:action="@{/points-de-vente/{id}/desactiver(id=${pdv.id})}" method="post"
                                  sec:authorize="hasRole('ADMIN')"
                                  onsubmit="return confirm('Désactiver ce point de vente ?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-secondary btn-sm">
                                    <i class="fas fa-ban"></i>
                                </button>
                            </form>
                            <form th:action="@{/points-de-vente/{id}/supprimer(id=${pdv.id})}" method="post"
                                  sec:authorize="hasRole('ADMIN')"
                                  onsubmit="return confirm('Supprimer ce point de vente ?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(pointsDeVente)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        <i class="fas fa-map-marker-alt fa-2x d-block mb-2 opacity-25"></i>
                        Aucun point de vente enregistré
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
