# =============================================================================
# Profil PROD — activer avec : spring.profiles.active=prod
# Les secrets viennent des variables d'environnement (jamais en dur ici).
# Voir docs/refonte/DEPLOIEMENT.md
# =============================================================================

spring.application.name=gestiboul
app.name=Gestiboul

server.port=${SERVER_PORT:9000}

# --- Base de données ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/boulangerie_bd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Licence (OBLIGATOIRE — contrôlé par ProdLicenseGuard) ---
app.license.salt=${LICENSE_SALT}

# --- Fichiers ---
app.upload.dir=${UPLOAD_DIR:/var/gestiboul/uploads}
app.documents.dir=${DOCUMENTS_DIR:/var/gestiboul/documents}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# --- Session / cookies (HTTPS recommandé) ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict

# --- API docs fermées ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Logs ---
logging.level.root=WARN
logging.level.lab.hang.Gestion.boulangerie=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF

# --- Divers ---
spring.mvc.hiddenmethod.filter.enabled=true
spring.thymeleaf.cache=true
