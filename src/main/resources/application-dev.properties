# Profil DEV — local Mac / Windows
# Activation : spring.profiles.active=dev (déjà défini dans application.properties)

spring.datasource.url=jdbc:mysql://localhost:3306/boulangerie_bd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Licence : salt faible autorisé hors prod
app.license.salt=${LICENSE_SALT:gestiboul-secret-2024}

# Mail optionnel en dev (EmailService ne plante plus au démarrage)
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

app.upload.dir=uploads
app.documents.dir=documents

logging.level.lab.hang.Gestion.boulangerie=INFO
spring.thymeleaf.cache=false
